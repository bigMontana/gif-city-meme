    <!-- Add Google Fonts -->

    <!-- Load FFmpeg scripts with proper order and defer attributes -->
    <link rel="icon" href="/public/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="view_single.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script type="module" src="/src/auth.js"></script>
    <!-- Import userService and expose it globally -->
    <script type="module">
        import { userService } from './src/userService.js';
        // Make userService available globally
        window.userService = userService;
    </script>
    <script src="./ffmpeg/ffmpeg.min.js" defer></script>
    <script defer>
        // This ensures FFmpeg scripts are loaded in the correct order
        window.addEventListener('DOMContentLoaded', () => {
            // Load core scripts dynamically with correct sequence
            const loadScript = (src, callback) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = callback;
                document.head.appendChild(script);
            };
            
            // First load core.js, then worker.js
            loadScript('/ffmpeg/ffmpeg-core.js', () => {
                loadScript('/ffmpeg/ffmpeg-core.worker.js', () => {
                    console.log('FFmpeg scripts loaded in correct sequence');
                    // Dispatch an event to notify the app
                    document.dispatchEvent(new Event('ffmpeg-scripts-loaded'));
                });
            });
        });
    </script>

</head>
<body>
    <div class="container">
        <div id="header-container"></div>

        <!-- Add upload container here, before video container -->
        <div class="upload-container"></div>

        <!-- Move status div here -->
        <div id="status" class="status"></div>
        <div id="status2" class="status"></div>

        <!-- Move scrubber container before video container -->
        <div class="scrubber-container">
            <div id="frameMarkers" class="frame-markers"></div>
            <input type="range" 
                   id="videoScrubber" 
                   min="0" 
                   max="0" 
                   value="0" 
                   step="1" 
                   style="width: 100%; margin: 20px 0;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <button id="chooseRangeBtn" class="choose-range-btn">Choose Range</button>
                <button id="removeWatermarkBtn" class="watermark-toggle-btn">Remove Watermark</button>
            </div>
        </div>
        
        <!-- Range slider container -->
        <div class="range-slider-container">
            <div class="range-slider" id="rangeSlider">
                <div class="range-selected"></div>
                <div class="handle start" id="startHandle"></div>
                <div class="handle end" id="endHandle"></div>
            </div>
            <div class="range-values">
                <span id="startValue">0:00</span> - <span id="endValue">0:00</span>
            </div>
        </div>

        <div id="video-container">
            <canvas id="renderCanvas"></canvas>
        </div>

       

        <!-- Add new resolution buttons in a container -->
        <div class="resolution-buttons-container">
            <button id="ffmpegButtonSD" class="ffmpeg-button resolution-button" disabled>
                Select MP4 480p
                <span id="ffmpegSpinnerSD" class="loading-spinner" style="display: none;"></span>
            </button>
            <button id="ffmpegButtonHD" class="ffmpeg-button resolution-button" disabled>
                Select MP4 720p
                <span id="ffmpegSpinnerHD" class="loading-spinner" style="display: none;"></span>
            </button>
            <button id="ffmpegButtonFullHD" class="ffmpeg-button resolution-button" disabled>
                Select MP4 1080p
                <span id="ffmpegSpinnerFullHD" class="loading-spinner" style="display: none;"></span>
            </button>
            
            <!-- GIF render buttons in their own row -->
            <div class="gif-buttons-row">
                <button id="ffmpegButtonGIF" class="ffmpeg-button resolution-button" disabled>
                    Select GIF Small
                    <span id="ffmpegSpinnerGIF" class="loading-spinner" style="display: none;"></span>
                </button>
                <button id="ffmpegButtonGIFMed" class="ffmpeg-button resolution-button" disabled>
                    Select GIF Med
                    <span id="ffmpegSpinnerGIFMed" class="loading-spinner" style="display: none;"></span>
                </button>
                <button id="ffmpegButtonGIFLarge" class="ffmpeg-button resolution-button" disabled>
                    Select GIF Large
                    <span id="ffmpegSpinnerGIFLarge" class="loading-spinner" style="display: none;"></span>
                </button>
            </div>
        </div>

         <!-- Replace the single ffmpeg button with a button container -->
         <button id="ffmpegButton" class="ffmpeg-button" disabled>
            Render Video for x Credits
            <span id="ffmpegSpinner" class="loading-spinner" style="display: none;"></span>
        </button>
        
        <div class="tally">
            <div id="tallyContent">
                <p><strong>Current Settings:</strong></p>
                <p id="tallyTimeLength">Time Length: 0 seconds <span class="credit-cost">(1 credit)</span></p>
                <p id="tallyWatermark">Watermark: Visible <span class="credit-cost">(0 credits)</span></p>
                <p id="tallyResolution">Format: MP4 1080p <span class="credit-cost">(3 credits)</span></p>
                <p id="tallyTotalCredits"><strong>Total: 4 credits</strong></p>
            </div>
        </div>
        
        <div class="footer">
            <div class="footer-links">
                <a href="#">About</a>
                <a href="#">Terms</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script type="module">
        // Import supabase module
        import * as supabaseModule from './src/supabase.js';
        
        // Global variables for range selection
        let isRangeActive = false;
        let startValue = 0;
        let endValue = 100;
        
        // Format time function - moved to global scope
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            // Get URL parameters - now just the ID
            const urlParams = new URLSearchParams(window.location.search);
            const templateId = urlParams.get('id');
            
            if (!templateId) {
                displayError('No template ID provided');
                return;
            }
            
            // Fetch template data using ID
            const template = await supabaseModule.fetchTemplateById(templateId);
            
            if (!template) {
                displayError('Template not found');
                return;
            }
            
            // Extract needed data from template
            const videoUrl = template.video_url;
            const jsonUrl = template.json_url;
            const title = template.title;
            const thumbnailUrl = template.thumbnail_url;

            // Update page title if provided
            if (title) {
                document.title = `GIFCITY - ${title}`;
            }

            const canvas = document.getElementById('renderCanvas');
            const ctx = canvas.getContext('2d');
            const video = document.createElement('video');
            video.setAttribute('crossorigin', 'anonymous');
            video.setAttribute('preload', 'auto');
            video.setAttribute('playsinline', '');
            video.crossOrigin = 'anonymous';  // Add this explicit setting
            const statusDiv = document.getElementById('status');
            const ffmpegButton = document.getElementById('ffmpegButton');
            const ffmpegSpinner = document.getElementById('ffmpegSpinner');
            const scrubber = document.getElementById('videoScrubber');
            
            // Validate video URL
            if (!videoUrl) {
                displayError('No video URL provided');
                return;
            }

            // Add a variable for the loading animation interval
            let loadingAnimationInterval;
            
            // Function to start the loading animation
            function startLoadingAnimation() {
                // Get status2 element
                const status2Div = document.getElementById('status2');
                let dotCount = 0;
                let startTime = Date.now();
                let longLoadMessage = false;
                
                // Clear any existing animation
                if (loadingAnimationInterval) {
                    clearInterval(loadingAnimationInterval);
                }
                
                // Start new animation
                loadingAnimationInterval = setInterval(() => {
                    dotCount = (dotCount + 1) % 30; // Cycle between 0-11 dots
                    const dots = '.'.repeat(dotCount);
                    
                    // After 5 seconds, change the message
                    const elapsedTime = Date.now() - startTime;
                    if (elapsedTime > 6000 && !longLoadMessage) {
                        longLoadMessage = true;
                    }
                    
                    const message = longLoadMessage ? "It's a big boy, hold tight" : "Loading Video";
                    status2Div.textContent = `${dots}${message}${dots}`;
                }, 200);
            }
            
            // Function to stop the loading animation
            function stopLoadingAnimation() {
                if (loadingAnimationInterval) {
                    clearInterval(loadingAnimationInterval);
                    loadingAnimationInterval = null;
                    document.getElementById('status2').textContent = '';
                }
            }
            
            // Override the onloadeddata event to stop animation when complete
            const originalOnLoadedData = video.onloadeddata;
            video.onloadeddata = function() {
                stopLoadingAnimation();
                if (originalOnLoadedData) {
                    originalOnLoadedData.call(this);
                }
            };
            
            // Function to attempt video loading with fetch first
            const loadVideo = async () => {
                try {
                    // Start the loading animation
                    startLoadingAnimation();
                    
                    // Fetch the video first with proper CORS settings
                    const response = await fetch(videoUrl, {
                        mode: 'cors',
                        credentials: 'omit' // Change from 'include' to 'omit'
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    // Create a blob from the response
                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    
                    // Set video source to the blob URL
                    video.src = blobUrl;
                    
                    video.onerror = () => {
                        // Stop the loading animation
                        stopLoadingAnimation();
                        
                        const errorMessage = video.error?.code ? 
                            `Error loading video (code ${video.error.code}): ${video.error?.message || 'Unknown error'}` : 
                            'Error loading video';
                        displayError(errorMessage);
                        console.error('Video error details:', video.error);
                        URL.revokeObjectURL(blobUrl);
                    };

                    // Add load event handler
                    video.onloadeddata = () => {
                        // Stop the loading animation
                        stopLoadingAnimation();
                        
                        statusDiv.textContent = 'Video loaded successfully';
                        statusDiv.style.color = '#44ff44';
                        // Re-enable FFmpeg button if FFmpeg is initialized
                        if (ffmpegState.ffmpeg && ffmpegState.ffmpeg.isLoaded()) {
                            ffmpegButton.disabled = false;
                        }
                        if (video.readyState >= 2) {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            
                            // Add scaling for tall videos
                            const videoContainer = document.getElementById('video-container');
                            if (video.videoHeight > 1080) {
                                videoContainer.style.transform = 'scale(0.6)';
                                videoContainer.style.transformOrigin = 'top center';
                            } else {
                                videoContainer.style.transform = 'none';
                                videoContainer.style.transformOrigin = 'center center';
                            }
                            
                            drawFrame();
                        }
                    };
                } catch (error) {
                    // Stop the loading animation
                    stopLoadingAnimation();
                    
                    console.error('Error fetching video:', error);
                    displayError(`Error fetching video: ${error.message}`);
                    
                    // Start a new loading animation for the fallback method
                    startLoadingAnimation();
                    
                    // Fallback to direct video source if fetch fails
                    video.src = videoUrl;
                    
                    // Add error handler for fallback method
                    video.onerror = () => {
                        stopLoadingAnimation();
                        const errorMessage = video.error?.code ? 
                            `Error loading video (code ${video.error.code}): ${video.error?.message || 'Unknown error'}` : 
                            'Error loading video';
                        displayError(errorMessage);
                        console.error('Video error details:', video.error);
                    };
                }
            };

            // Start video loading
            loadVideo();

            let frameData = {};
            let currentFrame = 0;
            let mediaRecorder;
            let chunks = [];
            let originalFrameData = {};
            let isOffsetActive = false;
            let imageButtons = new Map();
            let maskImagesCache = null;
            let audioContext = null;
            let audioSource = null;
            let audioDestination = null;
            let watermarkRemoved = false; // Global variable to track watermark state
            
            // Add logo image loading at the top with other initializations
            const logoImage = new Image();
            logoImage.onload = () => {
                if (video.readyState >= 2) {
                    drawFrame();
                }
            };
            logoImage.src = '/src/assets/images/gifcity_logo.png';
            
            // Global FFmpeg state tracking
            let ffmpegState = JSON.parse(sessionStorage.getItem('ffmpegState')) || {
                minLoaded: false,
                coreLoaded: false,
                workerLoaded: false,
                wasmLoaded: false,
                ffmpeg: null,
                initAttempts: 0
            };

            // Sequential loading with proper dependencies
            function loadFFmpegScriptsSequentially() {
                ffmpegSpinner.style.display = 'inline-block';
                ffmpegButton.disabled = true;
                ffmpegButtonSD.disabled = true;
                ffmpegButtonHD.disabled = true;
                ffmpegButtonFullHD.disabled = true;
                ffmpegButtonGIF.disabled = true;
                ffmpegButtonGIFMed.disabled = true;
                ffmpegButtonGIFLarge.disabled = true;
                statusDiv.textContent = 'Starting FFmpeg initialization...';
                
                // Step 1: Load the main FFmpeg min script
                const loadMinScript = () => {
                    return new Promise((resolve, reject) => {
                        if (ffmpegState.minLoaded) return resolve();
                        
                        statusDiv.textContent = 'Loading FFmpeg main script...';
                        const script = document.createElement('script');
                        script.src = '/ffmpeg/ffmpeg.min.js';
                        script.onload = () => {
                            console.log('FFmpeg min script loaded');
                            ffmpegState.minLoaded = true;
                            setTimeout(resolve, 500);
                        };
                        script.onerror = (err) => reject(new Error('Failed to load FFmpeg min script'));
                        document.head.appendChild(script);
                    });
                };
                
                // Step 2: Pre-load the core script
                const preloadCoreScript = () => {
                    return new Promise((resolve, reject) => {
                        if (ffmpegState.coreLoaded) return resolve();
                        
                        statusDiv.textContent = 'Pre-loading FFmpeg core script...';
                        const script = document.createElement('script');
                        script.src = '/ffmpeg/ffmpeg-core.js';
                        script.onload = () => {
                            console.log('FFmpeg core script pre-loaded');
                            ffmpegState.coreLoaded = true;
                            setTimeout(resolve, 500);
                        };
                        script.onerror = (err) => reject(new Error('Failed to pre-load FFmpeg core script'));
                        document.head.appendChild(script);
                    });
                };
                
                // Step 3: Initialize FFmpeg
                const initializeFFmpeg = async () => {
                    if (ffmpegState.ffmpeg && ffmpegState.ffmpeg.isLoaded()) {
                        return ffmpegState.ffmpeg;
                    }
                    
                    statusDiv.textContent = 'Creating FFmpeg instance...';
                    ffmpegState.initAttempts++;
                    
                    try {
                        const ffmpeg = FFmpeg.createFFmpeg({
                            log: true,
                            corePath: '/ffmpeg/ffmpeg-core.js',
                            workerPath: '/ffmpeg/ffmpeg-core.worker.js',
                            wasmPath: '/ffmpeg/ffmpeg-core.wasm'
                        });
                        
                        window.addEventListener('error', function(e) {
                            if (e.message.includes('worker.js received unknown command undefined')) {
                                console.log('Ignoring known FFmpeg worker warning');
                                e.preventDefault();
                                return true;
                            }
                        }, true);
                        
                        statusDiv.textContent = 'Loading FFmpeg WASM and Worker...';
                        
                        const loadPromise = ffmpeg.load();
                        const timeoutPromise = new Promise((_, reject) => {
                            setTimeout(() => reject(new Error('FFmpeg initialization timed out')), 30000);
                        });
                        
                        await Promise.race([loadPromise, timeoutPromise]);
                        
                        console.log('FFmpeg fully loaded and ready!');
                        statusDiv.textContent = 'All systems go!';
                        ffmpegState.ffmpeg = ffmpeg;
                        ffmpegButton.disabled = false;
                        ffmpegButtonSD.disabled = false;
                        ffmpegButtonHD.disabled = false;
                        ffmpegButtonFullHD.disabled = false;
                        ffmpegButtonGIF.disabled = false;
                        ffmpegButtonGIFMed.disabled = false;
                        ffmpegButtonGIFLarge.disabled = false;
                        ffmpegSpinner.style.display = 'none';
                        ffmpegSpinnerSD.style.display = 'none';
                        ffmpegSpinnerHD.style.display = 'none';
                        ffmpegSpinnerFullHD.style.display = 'none';
                        ffmpegSpinnerGIF.style.display = 'none';
                        ffmpegSpinnerGIFMed.style.display = 'none';
                        ffmpegSpinnerGIFLarge.style.display = 'none';
                        return ffmpeg;
                    } catch (error) {
                        console.error('FFmpeg initialization error:', error);
                        
                        if (ffmpegState.initAttempts >= 3) {
                            throw new Error(`FFmpeg failed to initialize after ${ffmpegState.initAttempts} attempts: ${error.message}`);
                        }
                        
                        const backoffTime = Math.pow(2, ffmpegState.initAttempts) * 1000;
                        statusDiv.textContent = `Retrying FFmpeg initialization in ${backoffTime/1000}s...`;
                        
                        await new Promise(resolve => setTimeout(resolve, backoffTime));
                        return initializeFFmpeg();
                    }
                };
                
                return loadMinScript()
                    .then(() => preloadCoreScript())
                    .then(() => initializeFFmpeg())
                    .catch(error => {
                        console.error('FFmpeg loading sequence failed:', error);
                        statusDiv.textContent = `Failed to initialize FFmpeg: ${error.message}`;
                        ffmpegSpinner.style.display = 'none';
                        
                        ffmpegButton.disabled = false;
                        ffmpegButtonSD.disabled = false;
                        ffmpegButtonHD.disabled = false;
                        ffmpegButtonFullHD.disabled = false;
                        ffmpegButtonGIF.disabled = false;
                        ffmpegButtonGIFMed.disabled = false;
                        ffmpegButtonGIFLarge.disabled = false;
                        ffmpegButton.textContent = 'Retry FFmpeg Initialization';
                        
                        ffmpegButton.onclick = () => {
                            ffmpegButton.textContent = 'Render MP4 1080p';
                            ffmpegState = {
                                minLoaded: ffmpegState.minLoaded,
                                coreLoaded: ffmpegState.coreLoaded,
                                workerLoaded: false,
                                wasmLoaded: false,
                                ffmpeg: null,
                                initAttempts: 0
                            };
                            loadFFmpegScriptsSequentially();
                        };
                        
                        throw error;
                    });
            }

            // Initialize FFmpeg when page loads
            setTimeout(() => {
                loadFFmpegScriptsSequentially().catch(err => {
                    console.error('Initial FFmpeg loading failed, will retry on button click:', err);
                });
            }, 2000);

            // Add resolution constants
            const RESOLUTION_TIERS = {
                SD: { width: 854, height: 480, name: "480p" },
                HD: { width: 1280, height: 720, name: "720p" },
                FULL_HD: { width: 1920, height: 1080, name: "1080p" }
            };

            // Add a global variable to store the selected render settings
            const renderSettings = {
                resolution: RESOLUTION_TIERS.FULL_HD,
                isGif: false,
                gifSize: 'small'
            };

            // Function to calculate credit costs based on settings
            function calculateCreditCosts() {
                let timeCost = 1; // Default for under 5 seconds
                let watermarkCost = watermarkRemoved ? 2 : 0;
                let formatCost = 3; // Default for 1080p
                
                // Calculate time cost based on duration
                const duration = isRangeActive 
                    ? (endValue - startValue) / 30 
                    : (video && video.duration ? video.duration : 0);
                
                if (duration >= 12) {
                    timeCost = 3;
                } else if (duration >= 5) {
                    timeCost = 2;
                }
                
                // Calculate format cost
                if (renderSettings.isGif) {
                    // GIF costs
                    if (renderSettings.gifSize === 'large') {
                        formatCost = 3;
                    } else if (renderSettings.gifSize === 'medium') {
                        formatCost = 2;
                    } else {
                        formatCost = 1; // small
                    }
                } else {
                    // MP4 costs
                    if (renderSettings.resolution === RESOLUTION_TIERS.FULL_HD) {
                        formatCost = 3;
                    } else if (renderSettings.resolution === RESOLUTION_TIERS.HD) {
                        formatCost = 2;
                    } else {
                        formatCost = 1; // SD
                    }
                }
                
                return {
                    timeCost,
                    watermarkCost,
                    formatCost,
                    totalCost: timeCost + watermarkCost + formatCost
                };
            }

            // Function to update the main render button text based on selected settings
            function updateRenderButtonText() {
                const resolutionName = renderSettings.isGif 
                    ? `GIF ${renderSettings.gifSize}` 
                    : `MP4 ${renderSettings.resolution.name}`;
                
                const costs = calculateCreditCosts();
                ffmpegButton.textContent = `Render for ${costs.totalCost} Credits`;
                
                // Don't call updateTallyInformation here to avoid circular references
                console.log("Render button updated with total credits:", costs.totalCost);
            }

            // Function to update the tally div with current settings
            function updateTallyInformation() {
                const tallyTimeLength = document.getElementById('tallyTimeLength');
                const tallyWatermark = document.getElementById('tallyWatermark');
                const tallyResolution = document.getElementById('tallyResolution');
                const tallyTotalCredits = document.getElementById('tallyTotalCredits');
                
                // Calculate credit costs
                const costs = calculateCreditCosts();
                
                // Update time length information
                if (isRangeActive) {
                    const durationInSeconds = (endValue - startValue) / 30;
                    // Round to nearest half second
                    const roundedDuration = Math.round(durationInSeconds * 2) / 2;
                    tallyTimeLength.textContent = `Time Length: ${roundedDuration} seconds`;
                } else if (video && video.duration) {
                    // Round to nearest half second
                    const roundedDuration = Math.round(video.duration * 2) / 2;
                    tallyTimeLength.textContent = `Time Length: ${roundedDuration} seconds`;
                } else {
                    tallyTimeLength.textContent = `Time Length: 0 seconds`;
                }
                tallyTimeLength.innerHTML = tallyTimeLength.textContent + ` <span class="credit-cost">(${costs.timeCost} credit${costs.timeCost !== 1 ? 's' : ''})</span>`;
                
                // Update watermark information
                tallyWatermark.textContent = `Watermark: ${watermarkRemoved ? 'Removed' : 'Visible'}`;
                tallyWatermark.innerHTML = tallyWatermark.textContent + ` <span class="credit-cost">(${costs.watermarkCost} credit${costs.watermarkCost !== 1 ? 's' : ''})</span>`;
                
                // Update resolution/format information
                const resolutionName = renderSettings.isGif 
                    ? `GIF ${renderSettings.gifSize}` 
                    : `MP4 ${renderSettings.resolution.name}`;
                tallyResolution.textContent = `Format: ${resolutionName}`;
                tallyResolution.innerHTML = tallyResolution.textContent + ` <span class="credit-cost">(${costs.formatCost} credit${costs.formatCost !== 1 ? 's' : ''})</span>`;
                
                // Update total credits
                tallyTotalCredits.innerHTML = `<strong>Total: ${costs.totalCost} credit${costs.totalCost !== 1 ? 's' : ''}</strong>`;
                
                // Also update the render button text
                updateRenderButtonText();
                
                // Check credits whenever the cost is updated (without showing alerts)
                // Only proceed if the user is logged in
                if (window.getCurrentUser()) {
                    // Get the user's credits from the header-credits element
                    const headerCredits = document.getElementById('headerCredits');
                    let userCredits = 0;
                    
                    if (headerCredits) {
                        userCredits = parseInt(headerCredits.textContent) || 0;
                    }
                    
                    // Determine if user has enough credits
                    const hasEnoughCredits = userCredits >= costs.totalCost;
                    
                    // Log the credit information to the console
                    console.log(`Credit check: User has ${userCredits} credits, this render costs ${costs.totalCost} credits. User is ${hasEnoughCredits ? 'able' : 'unable'} to render this video.`);
                    
                    // Update the render button style based on credit availability
                    if (ffmpegButton) {
                        if (hasEnoughCredits) {
                            ffmpegButton.classList.remove('insufficient-credits');
                        } else {
                            ffmpegButton.classList.add('insufficient-credits');
                        }
                    }
                }
            }

            // Function to clear selected state from all resolution buttons
            function clearSelectedButtons() {
                ffmpegButtonSD.classList.remove('selected');
                ffmpegButtonHD.classList.remove('selected');
                ffmpegButtonFullHD.classList.remove('selected');
                ffmpegButtonGIF.classList.remove('selected');
                ffmpegButtonGIFMed.classList.remove('selected');
                ffmpegButtonGIFLarge.classList.remove('selected');
            }

            // Set default selected resolution
            ffmpegButtonFullHD.classList.add('selected');
            updateRenderButtonText();
            
            // Initialize tally information

            // Function to draw the current frame of the video onto the canvas
            function drawFrame() {
                if (video.readyState >= 2) {
                    // Clear the canvas
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // Draw the video frame
                    try {
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        // Draw all faces from the original data structure
                        if (originalFrameData.faces) {
                            // Pre-load mask images to avoid async issues
                            const maskImages = new Map();
                            
                            Object.entries(originalFrameData.faces).forEach(([faceId, faceData]) => {
                                const data = getFrameData(currentFrame, faceData);
                                if (data && !data.hidden) {  // Only draw if not hidden
                                    ctx.save();
                                    ctx.translate(data.position.x, data.position.y);
                                    const finalScaleX = data.scale * data.scaleX * (data.xFlip ? -1 : 1);
                                    const finalScaleY = data.scale * data.scaleY;
                                    ctx.rotate(data.rotation * Math.PI / 180);
                                    ctx.scale(finalScaleX, finalScaleY);

                                    // Create a temporary canvas for the face and mask
                                    const tempCanvas = document.createElement('canvas');
                                    // Calculate face size based on video width, matching editor.html
                                    const faceSize = Math.round(canvas.width * 0.104); // 10.4% of video width
                                    tempCanvas.width = faceSize;
                                    tempCanvas.height = faceSize;
                                    const tempCtx = tempCanvas.getContext('2d');

                                    // Draw the face onto the temporary canvas
                                    const imageName = data.imageName || 'Default';
                                    const imageElement = imageButtons.get(`${faceId}_${imageName}`);

                                    // Check if we have a valid image, if not fall back to default
                                    let imageToUse = imageElement;
                                    if (!imageElement || imageElement.src.includes('data:image/svg+xml')) {
                                        // If no image or it's the placeholder SVG, use the default image
                                        imageToUse = imageButtons.get(`${faceId}_Default`);
                                    }

                                    // Only draw if we have a valid, loaded image
                                    if (imageToUse && imageToUse.complete && imageToUse.naturalWidth !== 0) {
                                        try {
                                            // Clear the temporary canvas first
                                            tempCtx.clearRect(0, 0, faceSize, faceSize);
                                            
                                            // Respect the aspect ratio of the original image
                                            const imgWidth = imageToUse.naturalWidth;
                                            const imgHeight = imageToUse.naturalHeight;
                                            const imgAspect = imgWidth / imgHeight;
                                            
                                            let drawWidth, drawHeight, offsetX = 0, offsetY = 0;
                                            
                                            if (imgAspect > 1) {
                                                // Landscape image - use full width, adjust height
                                                drawWidth = faceSize;
                                                drawHeight = faceSize / imgAspect;
                                                offsetY = (faceSize - drawHeight) / 2; // Center vertically
                                            } else {
                                                // Portrait or square image - use full height, adjust width
                                                drawHeight = faceSize;
                                                drawWidth = faceSize * imgAspect;
                                                offsetX = (faceSize - drawWidth) / 2; // Center horizontally
                                            }
                                            
                                            // Draw the face with proper aspect ratio
                                            tempCtx.drawImage(imageToUse, offsetX, offsetY, drawWidth, drawHeight);
                                        } catch (imgError) {
                                            console.warn(`Failed to draw image for ${faceId}_${imageName}:`, imgError);
                                            // Try to reload the image if it's the default one
                                            if (imageName === 'Default') {
                                                const newImg = new Image();
                                                newImg.crossOrigin = 'anonymous';
                                                newImg.onload = () => {
                                                    imageButtons.set(`${faceId}_Default`, newImg);
                                                    requestAnimationFrame(drawFrame);
                                                };
                                                newImg.onerror = () => {
                                                    console.error(`Failed to reload default image for ${faceId}`);
                                                };
                                                newImg.src = 'GERGFACE.png';
                                            }
                                        }
                                    }

                                    // Apply masking
                                    if (data.maskPoints && data.maskPoints.length > 0) {
                                        // Create a path for the mask using existing code
                                        tempCtx.beginPath();
                                        tempCtx.rect(0, 0, faceSize, faceSize);
                                        
                                        tempCtx.beginPath();
                                        const firstPoint = data.maskPoints[0];
                                        tempCtx.moveTo(firstPoint.x, firstPoint.y);
                                        
                                        for (let i = 1; i < data.maskPoints.length; i++) {
                                            const point = data.maskPoints[i];
                                            if (point.controlPoint1 && point.controlPoint2) {
                                                tempCtx.bezierCurveTo(
                                                    point.controlPoint1.x, point.controlPoint1.y,
                                                    point.controlPoint2.x, point.controlPoint2.y,
                                                    point.x, point.y
                                                );
                                            } else if (point.controlPoint1) {
                                                tempCtx.quadraticCurveTo(
                                                    point.controlPoint1.x, point.controlPoint1.y,
                                                    point.x, point.y
                                                );
                                            } else {
                                                tempCtx.lineTo(point.x, point.y);
                                            }
                                        }
                                        
                                        tempCtx.closePath();
                                        tempCtx.clip("evenodd");
                                    } else if (data.maskDataURL) {
                                        // Check if we've already processed this mask URL
                                        if (!maskImagesCache) {
                                            maskImagesCache = new Map();
                                        }
                                        
                                        let maskImg = maskImagesCache.get(data.maskDataURL);
                                        
                                        if (!maskImg) {
                                            maskImg = new Image();
                                            maskImg.src = data.maskDataURL;
                                            maskImagesCache.set(data.maskDataURL, maskImg);
                                        }
                                        
                                        if (maskImg.complete) {
                                            // Apply the mask to the temporary canvas
                                            tempCtx.globalCompositeOperation = 'destination-out';
                                            tempCtx.drawImage(maskImg, 0, 0, faceSize, faceSize);
                                            tempCtx.globalCompositeOperation = 'source-over';  // Reset composite operation
                                        } else {
                                            maskImg.onload = () => {
                                                requestAnimationFrame(drawFrame);
                                            };
                                        }
                                    }

                                    // Draw the masked face onto the main canvas
                                    const halfFaceSize = faceSize / 2;
                                    ctx.drawImage(tempCanvas, -halfFaceSize, -halfFaceSize, faceSize, faceSize);
                                    
                                    ctx.restore();
                                }
                            });
                        }

                        // Draw logo if needed
                        if (logoImage.complete) {
                            const padding = 40;
                            const logoWidth = Math.round(canvas.width * 0.25);  // 15% of video width
                            const logoHeight = Math.round(logoWidth * (logoImage.naturalHeight / logoImage.naturalWidth));  // Calculate height to maintain aspect ratio
                            
                            // Set up shadow
                            ctx.save();
                            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                            ctx.shadowBlur = 20;
                            ctx.shadowOffsetX = 5;
                            ctx.shadowOffsetY = 5;
                            
                            // Check if watermark should be hidden using the global variable
                            
                            // Set appropriate opacity
                            if (watermarkRemoved) {
                                ctx.globalAlpha = 0; // Hide watermark completely
                            } else {
                                ctx.globalAlpha = 1; // Show watermark normally
                            }
                            
                            ctx.drawImage(logoImage, 
                                padding,
                                canvas.height - logoHeight - padding,
                                logoWidth,
                                logoHeight
                            );
                            ctx.restore();
                        }
                        
                        // Request next frame if video is playing

                        const now = Date.now();
                        if (now - lastSeekTime < SEEK_DELAY) {

                            seekTimeout = setTimeout(() => handleSeek(targetTime), SEEK_DELAY);
                            return;

                            video.pause();

                            const onSeeked = () => {

                                video.removeEventListener('error', onError);
                                resolve();

            function getFrameData(frame, faceData) {
                frame = Math.floor(frame);
                
                const keyframes = Object.keys(faceData)
                    .map(Number)
                    .sort((a, b) => a - b);
                
                // Find the surrounding keyframes
                const nextKeyframeIndex = keyframes.findIndex(kf => kf > frame);
                
                // If this is an exact keyframe, return that frame's data directly
                if (keyframes.includes(frame)) {
                    return faceData[frame];
                }
                
                // Handle edge cases
                if (nextKeyframeIndex === -1) return {
                    ...faceData[keyframes[keyframes.length - 1]],
                    maskPoints: [],
                    maskDataURL: null
                };
                if (nextKeyframeIndex === 0) return {
                    ...faceData[keyframes[0]],
                    maskPoints: [],
                    maskDataURL: null
                };
                
                const prevKeyframe = keyframes[nextKeyframeIndex - 1];
                const nextKeyframe = keyframes[nextKeyframeIndex];
                
                // Calculate interpolation factor (0 to 1)
                const factor = (frame - prevKeyframe) / (nextKeyframe - prevKeyframe);
                
                // Get the data for both keyframes
                const prevData = faceData[prevKeyframe];
                const nextData = faceData[nextKeyframe];
                
                // Return interpolated data without any mask data
                return {
                    position: {
                        x: lerp(prevData.position.x, nextData.position.x, factor),
                        y: lerp(prevData.position.y, nextData.position.y, factor)
                    },
                    scale: lerp(prevData.scale, nextData.scale, factor),
                    scaleX: lerp(prevData.scaleX, nextData.scaleX, factor),
                    scaleY: lerp(prevData.scaleY, nextData.scaleY, factor),
                    rotation: lerpAngle(prevData.rotation, nextData.rotation, factor),
                    xFlip: prevData.xFlip,
                    hidden: prevData.hidden,
                    imageName: prevData.imageName || 'Default',
                    // No mask data for interpolated frames
                    maskPoints: [],
                    maskDataURL: null
                };
            }
            
            // Linear interpolation helper function with cubic easing
            function lerp(start, end, factor) {
                // Cubic easing function
                factor = factor * factor * (3 - 2 * factor);
                return start + (end - start) * factor;
            }
            
            // Special interpolation for angles to handle wraparound
            function lerpAngle(start, end, factor) {
                let diff = end - start;
                // Handle angle wraparound
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;
                // Apply cubic easing to angle interpolation
                factor = factor * factor * (3 - 2 * factor);
                return start + diff * factor;
            }

            // Add play event listener for continuous frame updates
            video.addEventListener('play', function() {
                function step() {
                    drawFrame();
                    if (!video.paused && !video.ended) {
                        requestAnimationFrame(step);

                requestAnimationFrame(step);

            // Function to render video with FFmpeg
            async function renderWithFFmpeg(resolution = RESOLUTION_TIERS.FULL_HD, spinner = ffmpegSpinner) {
                const ffmpeg = ffmpegState.ffmpeg;
                statusDiv.textContent = `Capturing frames for ${resolution.name} video...`;
                
                // Disable all buttons during rendering
                ffmpegButton.disabled = true;
                ffmpegButtonSD.disabled = true;
                ffmpegButtonHD.disabled = true;
                ffmpegButtonFullHD.disabled = true;
                ffmpegButtonGIF.disabled = true;
                
                // Determine the frame range to render
                let startFrame = 0;
                let endFrame = Math.floor(video.duration * 30) - 1;
                let totalFramesToRender;
                
                // If range selection is active, use the selected range
                if (isRangeActive) {
                    startFrame = startValue;
                    endFrame = endValue;
                    statusDiv.textContent = `Capturing frames for ${resolution.name} video (selected range only)...`;
                }
                
                totalFramesToRender = endFrame - startFrame + 1;
                
                // Reset video to start of the range
                video.currentTime = startFrame / 30;
                await new Promise(resolve => video.addEventListener('seeked', resolve, { once: true }));
                
                // Calculate aspect ratio-preserving dimensions
                const originalAspectRatio = video.videoWidth / video.videoHeight;
                let targetWidth, targetHeight;
                
                if (originalAspectRatio >= 1) {
                    // Landscape or square video
                    targetWidth = resolution.width;
                    targetHeight = Math.round(resolution.width / originalAspectRatio);
                } else {
                    // Portrait video
                    targetHeight = resolution.height;
                    targetWidth = Math.round(resolution.height * originalAspectRatio);
                }
                
                console.log(`Original video: ${video.videoWidth}x${video.videoHeight}, aspect ratio: ${originalAspectRatio}`);
                console.log(`Target resolution: ${targetWidth}x${targetHeight}`);
                
                // Create an offscreen canvas for resizing
                const offscreenCanvas = document.createElement('canvas');
                offscreenCanvas.width = targetWidth;
                offscreenCanvas.height = targetHeight;
                const offscreenCtx = offscreenCanvas.getContext('2d');
                
                // Function to capture a single frame with resolution
                function captureFrame() {
                    drawFrame();
                    return new Promise(resolve => {
                        requestAnimationFrame(() => {
                            // Draw to main canvas first
                            drawFrame();
                            
                            // Then resize to the target resolution
                            offscreenCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, targetWidth, targetHeight);
                            
                            // Get blob from the resized canvas
                            offscreenCanvas.toBlob(blob => {
                                frames.push(blob);
                                resolve();
                            }, 'image/jpeg', 0.95);
                        });
                    });
                }

                const frames = [];
                let audioContext = null;
                let audioSource = null;

                try {
                    // Capture all frames with proper timing
                    for (let i = 0; i < totalFramesToRender; i++) {
                        const frameIndex = startFrame + i;
                        video.currentTime = frameIndex / 30;
                        
                        // Wait for the video to actually seek to the new time
                        await new Promise(resolve => {
                            const onSeeked = () => {
                                video.removeEventListener('seeked', onSeeked);
                                resolve();
                            };
                            video.addEventListener('seeked', onSeeked);
                        });
                        
                        // Wait for the next frame to be rendered
                        await new Promise(resolve => requestAnimationFrame(resolve));
                        await captureFrame();
                        
                        // Update progress
                        statusDiv.textContent = `Capturing frames for ${resolution.name} video: ${Math.floor((i / totalFramesToRender) * 100)}%`;
                    }

                    statusDiv.textContent = 'Processing video with FFmpeg...';

                    // Write frames to FFmpeg filesystem
                    for (let i = 0; i < frames.length; i++) {
                        const frameName = `frame${i.toString().padStart(4, '0')}.jpg`;
                        const frameData = new Uint8Array(await frames[i].arrayBuffer());
                        ffmpeg.FS('writeFile', frameName, frameData);
                    }

                    // Clean up any existing audio connections
                    if (audioSource) {
                        audioSource.disconnect();
                        audioSource = null;
                    }
                    if (audioContext) {
                        await audioContext.close();
                        audioContext = null;
                    }

                    // Create a new video element for audio extraction
                    const tempVideo = document.createElement('video');
                    tempVideo.crossOrigin = 'anonymous';
                    
                    // Get the video URL
                    const videoSrc = video.src;
                    const audioBlobUrl = videoSrc;
                    tempVideo.src = audioBlobUrl;
                    tempVideo.muted = false;
                    tempVideo.volume = 1.0;
                    
                    // Wait for the temp video to be ready
                    await new Promise(resolve => {
                        tempVideo.onloadedmetadata = resolve;
                        tempVideo.load();
                    });
                    
                    // Create new audio context and connections with the temp video
                    audioContext = new AudioContext();
                    audioSource = audioContext.createMediaElementSource(tempVideo);
                    audioDestination = audioContext.createMediaStreamDestination();
                    audioSource.connect(audioDestination);
                    
                    // Record audio
                    const audioTrack = audioDestination.stream.getAudioTracks()[0];
                    const mediaRecorder = new MediaRecorder(new MediaStream([audioTrack]));
                    const audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.start();
                    
                    // Play the temp video to extract audio
                    tempVideo.currentTime = startFrame / 30;  // Start from the selected range
                    
                    // Set the playbackRate to normal (1.0)
                    tempVideo.playbackRate = 1.0;
                    
                    // Calculate the duration of the selected range in seconds
                    const rangeDuration = (endFrame - startFrame + 1) / 30;
                    
                    // Play the video for the duration of the selected range
                    await new Promise(resolve => {
                        const checkTime = () => {
                            if (tempVideo.currentTime >= (startFrame / 30) + rangeDuration) {
                                tempVideo.pause();
                                resolve();
                            } else {
                                requestAnimationFrame(checkTime);
                            }
                        };
                        
                        tempVideo.play().then(() => {
                            checkTime();
                        });
                    });
                    
                    mediaRecorder.stop();
                    await new Promise(resolve => mediaRecorder.onstop = resolve);
                    
                    // Clean up audio connections
                    audioSource.disconnect();
                    audioSource = null;
                    await audioContext.close();
                    audioContext = null;
                    
                    // Clean up temp video and blob URL
                    tempVideo.pause();
                    tempVideo.src = '';
                    URL.revokeObjectURL(audioBlobUrl);
                    
                    // Process the audio data
                    const processedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioData = new Uint8Array(await processedAudioBlob.arrayBuffer());
                    ffmpeg.FS('writeFile', 'audio.webm', audioData);

                    // Update FFmpeg command to ensure proper frame handling
                    await ffmpeg.run(
                        // Input frames
                        '-framerate', '30',
                        '-pattern_type', 'sequence',
                        '-i', 'frame%04d.jpg',
                        // Input audio
                        '-i', 'audio.webm',
                        // Output options
                        '-c:v', 'libx264',
                        '-s', `${targetWidth}x${targetHeight}`, // Set the exact dimensions
                        '-pix_fmt', 'yuv420p',
                        '-preset', 'medium',
                        '-crf', '23',
                        '-c:a', 'aac',
                        '-b:a', '128k',
                        '-movflags', '+faststart',
                        'output.mp4'
                    );

                    // Read the output file
                    const data = ffmpeg.FS('readFile', 'output.mp4');

                    // Clean up files
                    frames.forEach((_, i) => {
                        const frameName = `frame${i.toString().padStart(4, '0')}.jpg`;
                        ffmpeg.FS('unlink', frameName);
                    });
                    ffmpeg.FS('unlink', 'audio.webm');
                    ffmpeg.FS('unlink', 'output.mp4');

                    // Create download link
                    const blob = new Blob([data.buffer], { type: 'video/mp4' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    
                    // Add range info to filename if range is active
                    let filename = `meme_ffmpeg_${targetWidth}x${targetHeight}_${resolution.name}`;
                    if (isRangeActive) {
                        const startTimeStr = formatTime(startFrame / 30).replace(':', 'm') + 's';
                        const endTimeStr = formatTime(endFrame / 30).replace(':', 'm') + 's';
                        filename += `_range_${startTimeStr}-${endTimeStr}`;
                    }
                    a.download = `${filename}.mp4`;
                    
                    document.body.appendChild(a);
                    a.click();
                    
                    // Clean up
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 100);

                    statusDiv.textContent = `FFmpeg export complete! ${targetWidth}x${targetHeight} (${resolution.name}) file size: ${(blob.size / 1024 / 1024).toFixed(2)} MB`;
                    ffmpegButton.disabled = false;
                    ffmpegButtonSD.disabled = false;
                    ffmpegButtonHD.disabled = false;
                    ffmpegButtonFullHD.disabled = false;
                    ffmpegButtonGIF.disabled = false;
                    spinner.style.display = 'none';

                } catch (error) {
                    // Clean up audio on error
                    if (audioSource) {
                        audioSource.disconnect();
                        audioSource = null;
                    }
                    if (audioContext) {
                        await audioContext.close();
                        audioContext = null;
                    }
                    console.error('FFmpeg processing error:', error);
                    statusDiv.textContent = 'FFmpeg processing failed: ' + error.message;
                    
                    // Re-enable all buttons and hide spinner
                    ffmpegButton.disabled = false;
                    ffmpegButtonSD.disabled = false;
                    ffmpegButtonHD.disabled = false;
                    ffmpegButtonFullHD.disabled = false;
                    ffmpegButtonGIF.disabled = false;
                    spinner.style.display = 'none';
                }
            }

            // Function to render GIF with FFmpeg
            async function renderAsGIF(resolution = RESOLUTION_TIERS.SD, spinner = ffmpegSpinnerGIF, size = 'small') {
                const ffmpeg = ffmpegState.ffmpeg;
                statusDiv.textContent = `Capturing frames for ${size} GIF...`;
                
                // Disable all buttons during rendering
                ffmpegButton.disabled = true;
                ffmpegButtonSD.disabled = true;
                ffmpegButtonHD.disabled = true;
                ffmpegButtonFullHD.disabled = true;
                ffmpegButtonGIF.disabled = true;
                ffmpegButtonGIFMed.disabled = true;
                ffmpegButtonGIFLarge.disabled = true;
                
                // Determine the frame range to render
                let startFrame = 0;
                let endFrame = Math.floor(video.duration * 30) - 1;
                
                // If range selection is active, use the selected range
                if (isRangeActive) {
                    startFrame = startValue;
                    endFrame = endValue;
                    statusDiv.textContent = `Capturing frames for ${size} GIF (selected range only)...`;
                }
                
                // For GIF capture every 4th frame to reduce size (7.5fps from 30fps source)
                const frameStep = 4;
                const totalFramesToCapture = Math.floor((endFrame - startFrame + 1));
                const totalGifFrames = Math.floor(totalFramesToCapture / frameStep);
                
                // Reset video to start of the range
                video.currentTime = startFrame / 30;
                await new Promise(resolve => video.addEventListener('seeked', resolve, { once: true }));
                
                const frames = [];
                
                // Calculate aspect ratio-preserving dimensions at half the size of 480p
                const originalAspectRatio = video.videoWidth / video.videoHeight;
                let targetWidth, targetHeight;
                
                const smallResolution = {
                    width: Math.floor(resolution.width / 3),
                    height: Math.floor(resolution.height / 3),
                    name: "Small"
                };

                const medResolution = {
                    width: Math.floor(resolution.width / 2),
                    height: Math.floor(resolution.height / 2),
                    name: "Medium"
                };

                const largeResolution = {
                    width: Math.floor(resolution.width / 1),
                    height: Math.floor(resolution.height / 1),
                    name: "Large"
                };
                
                // Select the appropriate resolution based on the size parameter
                let selectedResolution;
                if (size === 'medium') {
                    selectedResolution = medResolution;
                } else if (size === 'large') {
                    selectedResolution = largeResolution;
                } else {
                    selectedResolution = smallResolution;
                }
                
                if (originalAspectRatio >= 1) {
                    // Landscape or square video
                    targetWidth = selectedResolution.width;
                    targetHeight = Math.round(selectedResolution.width / originalAspectRatio);
                } else {
                    // Portrait video
                    targetHeight = selectedResolution.height;
                    targetWidth = Math.round(selectedResolution.height * originalAspectRatio);
                }
                
                console.log(`Original video: ${video.videoWidth}x${video.videoHeight}, aspect ratio: ${originalAspectRatio}`);
                console.log(`Target GIF resolution: ${targetWidth}x${targetHeight}`);
                
                // Create an offscreen canvas for resizing
                const offscreenCanvas = document.createElement('canvas');
                offscreenCanvas.width = targetWidth;
                offscreenCanvas.height = targetHeight;
                const offscreenCtx = offscreenCanvas.getContext('2d');
                
                // Function to capture a single frame with resolution
                function captureFrame() {
                    drawFrame();
                    return new Promise(resolve => {
                        requestAnimationFrame(() => {
                            // Draw to main canvas first
                            drawFrame();
                            
                            // Then resize to the target resolution
                            offscreenCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, targetWidth, targetHeight);
                            
                            // Get blob from the resized canvas
                            offscreenCanvas.toBlob(blob => {
                                frames.push(blob);
                                resolve();
                            }, 'image/jpeg', 0.95);
                        });
                    });
                }

                try {
                    // Capture frames with frameStep for GIF (reduced framerate)
                    for (let i = 0; i < totalFramesToCapture; i += frameStep) {
                        const frameIndex = startFrame + i;
                        video.currentTime = frameIndex / 30;
                        
                        // Wait for the video to actually seek to the new time
                        await new Promise(resolve => {
                            const onSeeked = () => {
                                video.removeEventListener('seeked', onSeeked);
                                resolve();
                            };
                            video.addEventListener('seeked', onSeeked);
                        });
                        
                        // Wait for the next frame to be rendered
                        await new Promise(resolve => requestAnimationFrame(resolve));
                        await captureFrame();
                        
                        // Update progress
                        const progress = Math.floor((i / totalFramesToCapture) * 100);
                        statusDiv.textContent = `Capturing frames for ${size} GIF: ${progress}%`;
                    }

                    statusDiv.textContent = 'Creating GIF with FFmpeg...';

                    // Write frames to FFmpeg filesystem
                    for (let i = 0; i < frames.length; i++) {
                        const frameName = `frame${i.toString().padStart(4, '0')}.jpg`;
                        const frameData = new Uint8Array(await frames[i].arrayBuffer());
                        ffmpeg.FS('writeFile', frameName, frameData);
                        
                        if (i % 10 === 0) {
                            console.log(`Writing frame ${i} of ${frames.length}`);
                        }
                    }

                    // Use FFmpeg to create the GIF
                    await ffmpeg.run(
                        // Input frames
                        '-framerate', '7.5',
                        '-pattern_type', 'sequence',
                        '-i', 'frame%04d.jpg',
                        // GIF settings
                        '-vf', `scale=${targetWidth}:${targetHeight}:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse=dither=sierra2_4a`,
                        // Output file
                        'output.gif'
                    );

                    // Read the output file
                    const data = ffmpeg.FS('readFile', 'output.gif');

                    // Clean up files
                    frames.forEach((_, i) => {
                        const frameName = `frame${i.toString().padStart(4, '0')}.jpg`;
                        ffmpeg.FS('unlink', frameName);
                    });
                    ffmpeg.FS('unlink', 'output.gif');

                    // Create download link
                    const blob = new Blob([data.buffer], { type: 'image/gif' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    
                    // Add range info to filename if range is active
                    let filename = `meme_gif_${targetWidth}x${targetHeight}_${size}`;
                    if (isRangeActive) {
                        const startTimeStr = formatTime(startFrame / 30).replace(':', 'm') + 's';
                        const endTimeStr = formatTime(endFrame / 30).replace(':', 'm') + 's';
                        filename += `_range_${startTimeStr}-${endTimeStr}`;
                    }
                    a.download = `${filename}.gif`;
                    
                    document.body.appendChild(a);
                    a.click();
                    
                    // Clean up
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 100);

                    statusDiv.textContent = `GIF creation complete! ${targetWidth}x${targetHeight} (${size}) file size: ${(blob.size / 1024 / 1024).toFixed(2)} MB`;
                    
                    // Re-enable all buttons
                    ffmpegButton.disabled = false;
                    ffmpegButtonSD.disabled = false;
                    ffmpegButtonHD.disabled = false;
                    ffmpegButtonFullHD.disabled = false;
                    ffmpegButtonGIF.disabled = false;
                    ffmpegButtonGIFMed.disabled = false;
                    ffmpegButtonGIFLarge.disabled = false;
                    spinner.style.display = 'none';
                } catch (error) {
                    console.error('GIF processing error:', error);
                    statusDiv.textContent = 'GIF processing failed: ' + error.message;
                    
                    // Re-enable all buttons
                    ffmpegButton.disabled = false;
                    ffmpegButtonSD.disabled = false;
                    ffmpegButtonHD.disabled = false;
                    ffmpegButtonFullHD.disabled = false;
                    ffmpegButtonGIF.disabled = false;
                    ffmpegButtonGIFMed.disabled = false;
                    ffmpegButtonGIFLarge.disabled = false;
                    spinner.style.display = 'none';
                }
            }

            // After successful initialization
            function updateFFmpegState() {
                const stateToStore = {...ffmpegState};
                // We can't store the ffmpeg object itself
                delete stateToStore.ffmpeg;
                sessionStorage.setItem('ffmpegState', JSON.stringify(stateToStore));
            }

            // Create a worker
            const ffmpegWorker = new Worker('/ffmpeg-worker.js');

            // Send processing tasks to the worker
            ffmpegWorker.postMessage({
                type: 'process',
                data: frameData
            });

                scrubber.max = totalFrames - 1;

                // Update time display
