<!-- Header Section -->
<link rel="stylesheet" href="header.css">

<header class="header">
    <a href="index.html" class="logo">
        <img src="/src/assets/images/gifcity_logo.png" alt="GIF CITY Logo">
    </a>
    <div class="buttons" id="headerButtons">
        <div class="header-credits" id="headerCredits">?</div>
        <button class="btn btn-secondary" id="profileBtn" style="display: none;">Profile</button>
        <button class="btn btn-light" id="authBtn">Log In</button>
    </div>
</header>

<!-- Auth Modal -->
<div id="authModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div id="loginForm">
            <h2>Login</h2>
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button class="btn btn-primary" onclick="login()">Login</button>
            <p>Don't have an account? <a href="#" onclick="toggleAuthForm()">Sign Up</a></p>
        </div>
        <div id="signupForm" style="display: none;">
            <h2>Sign Up</h2>
            <input type="text" id="signupUsername" placeholder="Username" required>
            <input type="email" id="signupEmail" placeholder="Email" required>
            <input type="password" id="signupPassword" placeholder="Password" required>
            <button class="btn btn-primary" onclick="signup()">Sign Up</button>
            <p>Already have an account? <a href="#" onclick="toggleAuthForm()">Login</a></p>
        </div>
    </div>
</div>

<script type="module">
    import { supabase } from './src/supabase.js';
    import { auth } from './src/auth.js';
    import { userService } from './src/userService.js';

    // DOM Elements
    const authModal = document.getElementById('authModal');
    const closeBtn = document.querySelector('.close');
    const authBtn = document.getElementById('authBtn');
    const profileBtn = document.getElementById('profileBtn');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');

    // Auth state management
    let currentUser = null;

    // Handle email confirmation when the page loads
    async function handleEmailConfirmation() {
        // Check if we have a confirmation hash in the URL
        const hash = window.location.hash;
        if (hash && (hash.includes('access_token') || hash.includes('confirmation_token'))) {
            console.log('Detected confirmation URL, processing...');
            try {
                // The supabase client will automatically handle the token exchange
                const { data, error } = await supabase.auth.getSession();
                
                if (error) {
                    console.error('Error confirming email:', error);
                    alert('There was an error confirming your email. Please try again or contact support.');
                } else if (data.session) {
                    console.log('Email confirmed successfully!');
                    
                    try {
                        // Try to create the user profile
                        const { initializeUserData } = await import('./src/auth.js');
                        
                        // The user session contains all the needed information
                        await initializeUserData(
                            data.session.user.id,
                            data.session.user.email,
                            data.session.user.user_metadata?.username
                        );
                        
                        // Redirect to relevant page or update UI
                        alert('Your email has been confirmed successfully! You are now logged in.');
                        currentUser = data.session.user;
                        updateUIForLoggedInUser();
                        
                        // Clean URL
                        window.history.replaceState(null, '', window.location.pathname);
                    } catch (error) {
                        console.error('Error setting up user profile:', error);
                        
                        // Fallback: Show a message to the user but still let them in
                        alert('Your email has been confirmed and you can use the application, but there was an issue setting up your profile completely. Some features may be limited.');
                        currentUser = data.session.user;
                        updateUIForLoggedInUser();
                    }
                }
            } catch (err) {
                console.error('Exception during confirmation:', err);
            }
        }
    }

    // Check initial auth state
    async function checkInitialAuthState() {
        const { session, error } = await auth.getSession();
        if (session) {
            currentUser = session.user;
            updateUIForLoggedInUser();
            console.log('User is logged in:', currentUser.email);
        } else {
            updateUIForLoggedOutUser();
            console.log('No user session found');
        }
    }

    // Call this before checking initial auth state
    handleEmailConfirmation();
    // Check initial auth state 
    checkInitialAuthState();

    // Listen for auth changes
    const authListener = supabase.auth.onAuthStateChange((event, session) => {
        console.log('Auth state changed:', event);
        if (event === 'SIGNED_IN' || event === 'USER_UPDATED') {
            currentUser = session.user;
            updateUIForLoggedInUser();
            console.log('User signed in:', currentUser.email);
        } else if (event === 'SIGNED_OUT') {
            currentUser = null;
            updateUIForLoggedOutUser();
            console.log('User signed out');
        }
    });

    // UI Updates
    async function updateUIForLoggedInUser() {
        const authBtn = document.getElementById('authBtn');
        const profileBtn = document.getElementById('profileBtn');
        
        if (authBtn) authBtn.textContent = 'Log Out';
        if (profileBtn) {
            profileBtn.style.display = 'block';
            profileBtn.style.visibility = 'visible';
        }
        
        // Update credits display
        await updateCreditsDisplay();
    }

    // Function to update the credits display
    async function updateCreditsDisplay() {
        if (!currentUser) return;
        
        try {
            const userData = await userService.getUserData(currentUser.id, true);
            if (userData) {
                const credits = userData.credits || 0;
                
                // Update header credits display
                const headerCredits = document.getElementById('headerCredits');
                if (headerCredits) {
                    headerCredits.textContent = `${credits}`;
                }
            }
        } catch (error) {
            console.error('Error updating credits display:', error);
        }
    }

    function updateUIForLoggedOutUser() {
        const authBtn = document.getElementById('authBtn');
        const profileBtn = document.getElementById('profileBtn');
        
        if (authBtn) authBtn.textContent = 'Log In';
        if (profileBtn) profileBtn.style.display = 'none';
        
        // Reset credits display
        const headerCredits = document.getElementById('headerCredits');
        if (headerCredits) headerCredits.textContent = '?';
    }

    // Auth Modal Controls
    if (authBtn) {
        authBtn.onclick = async () => {
            if (currentUser) {
                try {
                    const { error } = await auth.signOut();
                    if (error) {
                        console.error('Error signing out:', error);
                        alert('Error signing out: ' + error.message);
                    } else {
                        console.log('User signed out successfully');
                        // No need to manually update UI here as the auth listener will handle it
                    }
                } catch (err) {
                    console.error('Exception during sign out:', err);
                    alert('Error signing out: ' + err.message);
                }
            } else {
                if (authModal) authModal.style.display = 'block';
            }
        };
    }

    if (closeBtn) {
        closeBtn.onclick = () => {
            if (authModal) authModal.style.display = 'none';
        };
    }

    if (authModal) {
        window.onclick = (event) => {
            if (event.target == authModal) {
                authModal.style.display = 'none';
            }
        };
    }

    // Toggle between login and signup forms
    window.toggleAuthForm = () => {
        if (loginForm && signupForm) {
            loginForm.style.display = loginForm.style.display === 'none' ? 'block' : 'none';
            signupForm.style.display = signupForm.style.display === 'none' ? 'block' : 'none';
        }
    };

    // Signup handler
    window.signup = async () => {
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        const username = document.getElementById('signupUsername').value;

        try {
            const { data, error } = await auth.signUp(email, password, username);
            if (error) {
                console.error('Detailed signup error:', error);
                alert('Error signing up: ' + (error.message || JSON.stringify(error)));
            } else {
                alert('Please check your email for the confirmation link!');
                if (authModal) authModal.style.display = 'none';
            }
        } catch (error) {
            console.error('Exception during signup:', error);
            alert('Error creating account: ' + (error.message || JSON.stringify(error)));
        }
    };

    // Login handler
    window.login = async () => {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const { data, error } = await auth.signIn(email, password);
            if (error) {
                console.error('Login error:', error);
                alert('Error logging in: ' + error.message);
            } else {
                console.log('Login successful');
                if (authModal) authModal.style.display = 'none';
                // The auth state listener will update the UI
            }
        } catch (error) {
            console.error('Exception during login:', error);
            alert('Error logging in: ' + error.message);
        }
    };

    // Debug authentication state
    window.checkAuthState = async () => {
        const { session } = await auth.getSession();
        console.log('Current session:', session);
        if (session) {
            console.log('User ID:', session.user.id);
            console.log('User email:', session.user.email);
            console.log('Email confirmed:', session.user.email_confirmed_at);
            console.log('User metadata:', session.user.user_metadata);
        } else {
            console.log('No active session found.');
        }
        return session;
    };

    // Add profile button click handler
    if (profileBtn) {
        profileBtn.onclick = () => {
            window.location.href = '/profile.html';
        };
    }

    // Run initial auth check
    checkAuthState().then(session => {
        console.log('Header component: Initial auth check complete.');
    });

    // Expose currentUser to global scope for other components
    window.getCurrentUser = () => currentUser;

    window.userService = userService;
    window.isUserLoggedIn = () => currentUser !== null;
    window.getCurrentUser = () => currentUser;
    window.fetchUserSavedFaces = async () => {
    if (!currentUser) return { data: null, error: new Error('Not logged in') };
    
    try {
        return await supabase
        .from('user_faces')
        .select('*')
        .eq('user_id', currentUser.id);
    } catch (error) {
        console.error('Error fetching saved faces:', error);
        return { data: null, error };
    }
    };

    window.getSupabaseStorageUrl = async (path) => {
    return await supabase.storage
        .from('user_faces')
        .getPublicUrl(path);
    };

    window.checkRenderCredits = async (creditCost) => {
    if (!currentUser) {
        return { success: false, message: 'Not logged in' };
    }
    
    try {
        const userData = await userService.getUserData(currentUser.id, true);
        const userCredits = userData?.credits || 0;
        
        if (userCredits < creditCost) {
        return { 
            success: false, 
            message: 'Not enough credits', 
            credits: userCredits, 
            cost: creditCost 
        };
        }
        
        return { 
        success: true, 
        credits: userCredits, 
        cost: creditCost 
        };
    } catch (error) {
        console.error('Error checking credits:', error);
        return { success: false, message: error.message };
    }
    };

    window.useCredits = async (cost) => {
    if (!currentUser) {
        return { success: false, message: 'Not logged in' };
    }
    
    try {
        const result = await userService.useCredits(currentUser.id, cost);
        
        if (result.success) {
        // Update the header UI after deducting credits
        await updateCreditsDisplay();
        }
        
        return result;
    } catch (error) {
        console.error('Error using credits:', error);
        return { success: false, message: error.message };
    }
    };

    // Add a function to fetch template data
    window.fetchTemplateById = async (templateId) => {
    try {
        const { data, error } = await supabase
        .from('templates')
        .select('*')
        .eq('id', templateId)
        .single();
        
        if (error) throw error;
        return data;
    } catch (error) {
        console.error('Error fetching template:', error);
        return null;
    }
    };

    // Dispatch an event when header is fully initialized
    document.addEventListener('DOMContentLoaded', () => {
    const event = new CustomEvent('header-initialized');
    document.dispatchEvent(event);
    });

    window.getUserTableData = async (userId) => {
        if (!userId) {
            const currentUser = window.getCurrentUser();
            if (!currentUser) return { error: 'No user logged in' };
            userId = currentUser.id;
        }
        
        try {
            // Direct query to the users table for all fields
            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('id', userId)
                .single();
                
            if (error) throw error;
            return data;
        } catch (error) {
            console.error('Error fetching user table data:', error);
            return { error: error.message };
        }
    };
</script>
