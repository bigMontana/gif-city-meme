    <style>
    .recent-renders {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 20px;
        margin: 20px 0;
    }

    .recent-renders h2 {
        color: #DA3A98;
        margin-bottom: 15px;
        font-family: 'Work Sans', sans-serif;
    }

    .recent-renders-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
    }

    .recent-render-item {
        display: flex;
        flex-direction: column;
        padding: 15px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        text-decoration: none;
        color: white;
        transition: transform 0.2s, background 0.2s;
    }

    .recent-render-item:hover {
        background: rgba(0, 0, 0, 0.3);
        transform: translateY(-2px);
    }

    .render-info {
        margin-top: 10px;
    }

    .render-info strong {
        display: block;
        margin-bottom: 5px;
        color: #36B2B7;
    }

    .render-info small {
        color: #888;
    }

    .no-renders {
        text-align: center;
        color: #888;
        padding: 20px;
    }

    .download-btn {
        background: #36B2B7;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 10px;
        transition: background 0.2s;
    }

    .download-btn:hover {
        background: #2a8a8f;
    }
    </style>
</head>
<body>
    <div class="container">
        <div id="header-container"></div>

        <!-- Profile Content Container (Empty) -->
        <div class="profile-content">
            <div class="profile-top-bar">
                <div class="profile-info">
                    <div class="profile-username" id="profileUsername">Username</div>
                    <div class="profile-email" id="profileEmail">user@example.com</div>
                    <div class="profile-subscription" id="profileSubscription">MEMBER FOR 0 DAYS</div>
                    <div class="profile-credits" id="profileCredits">CREDITS: 0</div>
                </div>
            </div>
            
            <!-- Face Quota Container -->
            <div class="face-quota-container">
                <div class="face-quota-title">Saved Face Slots (<span id="faceQuotaCount">0</span>)</div>
                <div class="face-buttons-container" id="faceButtonsContainer">
                </div>
                <div class="unlockFacesButton">
                    <button id="unlockFacesButton">Unlock 10 Face Slots for 250 Credits</button>
                </div>
            </div>
        </div>

        <!-- Add this after the profile-stats div and before the profile-content div -->
        <div class="recent-renders">
            <h2>Recent Renders</h2>
            <div id="recentRendersList" class="recent-renders-list">
                <!-- Renders will be populated here -->
            </div>
        </div>

        <div id="footer-container"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script type="module" src="/src/supabase.js"></script>
   
    <script type="module">
        import { uploadUserFace } from './src/supabase.js';
        import { createUserFace } from './src/supabase.js';
        import { getUserSavedFaces } from './src/supabase.js';
        import { removeUserFace } from './src/supabase.js';

        // Script for profile.html to work with the header component
        let faceCount = 0;
        document.addEventListener('DOMContentLoaded', function() {
            // Profile elements
            const profileUsername = document.getElementById('profileUsername');
            const profileEmail = document.getElementById('profileEmail');
            const profileSubscription = document.getElementById('profileSubscription');
            const profileCredits = document.getElementById('profileCredits');
            
            // Check if header component is loaded
            const checkHeaderLoaded = () => {
                if (typeof window.getCurrentUser === 'function') {
                    initProfilePage();
                } else {
                    // Wait for header component to fully load
                    setTimeout(checkHeaderLoaded, 100);
                }
            };
            
            // Initialize profile page
            const initProfilePage = async () => {
                // Get current user from header component
                const currentUser = window.getCurrentUser();
                
                if (currentUser) {
                    updateProfileDisplay(currentUser);
                    // Wait for getFaceCount to complete and store the result
                    const faceCount = await getFaceCount();
                    // Pass the face count to initSavedFaces
                    initSavedFaces(faceCount || 0);
                    // Setup auth state change listener
                    setupAuthChangeListener();
                } else {
                    // No user is logged in, redirect to home page
                    window.location.href = 'index.html';
                }
            };

            // Initialize profile page
            const initSavedFaces = async (count) => {
                // Create upload buttons for each face slot
                const faceButtonsContainer = document.getElementById('faceButtonsContainer');
                if (faceButtonsContainer) {
                    const currentUser = window.getCurrentUser();
                    // Get existing saved faces
                    const savedFaces = await getUserSavedFaces(currentUser.id);
                    
                    for (let i = 0; i < count; i++) {
                        const slotIndex = i;
                        
                        // Create a hidden file input for this slot
                        const fileInput = document.createElement('input');
                        fileInput.type = 'file';
                        fileInput.accept = 'image/*';
                        fileInput.style.display = 'none';
                        fileInput.id = `face-upload-input-${slotIndex}`;
                        document.body.appendChild(fileInput);
                        
                        // Create the visible button
                        const faceButton = document.createElement('button');
                        faceButton.className = 'face-button';
                        
                        // Check if there's an existing face for this slot
                        const existingFace = savedFaces.find(face => face.face_number === slotIndex + 1);
                        
                        if (existingFace) {
                            // Create an image element for the existing face
                            const img = document.createElement('img');
                            img.crossOrigin = "anonymous";  // Add crossorigin attribute
                            img.src = existingFace.face_path;
                            // img.style.width = '100%';
                            // img.style.height = '100%';
                            // img.style.objectFit = 'cover';
                            // Add error handling for image loading
                            img.onerror = () => {
                                console.error('Failed to load image:', existingFace.face_path);
                                faceButton.textContent = 'Upload Face Slot ' + (slotIndex + 1);
                            };
                            faceButton.appendChild(img);

                            // Add delete button
                            const deleteBtn = document.createElement('button');
                            deleteBtn.className = 'delete-face-btn';
                            deleteBtn.innerHTML = '×'; // × symbol for delete
                            deleteBtn.title = 'Delete face';
                            
                            // Handle delete button click
                            deleteBtn.addEventListener('click', async (e) => {
                                e.stopPropagation(); // Prevent triggering the file input click
                                
                                try {
                                    const currentUser = window.getCurrentUser();
                                    if (!currentUser) {
                                        console.error('No user logged in');
                                        return;
                                    }

                                    // Show confirmation dialog
                                    if (confirm('Are you sure you want to delete this face?')) {
                                        deleteBtn.textContent = '...'; // Show loading state
                                        removeUserFace(currentUser.id, slotIndex + 1).then(() => {
                                            // Reset the button to upload state
                                            faceButton.textContent = 'Upload Face Slot ' + (slotIndex + 1);
                                        });
                                        
                                        // Reset the button to upload state
                                        faceButton.textContent = 'Upload Face Slot ' + (slotIndex + 1);
                                    }
                                } catch (error) {
                                    console.error('Error deleting face:', error);
                                    alert('Failed to delete face. Please try again.');
                                }
                            });

                            faceButton.appendChild(deleteBtn);
                        } else {
                            faceButton.textContent = 'Upload Face Slot ' + (slotIndex + 1);
                        }
                        
                        // Handle button click - trigger file input
                        faceButton.addEventListener('click', () => {
                            console.log('Face upload button clicked for slot', slotIndex + 1);
                            fileInput.click(); // Trigger file selection dialog
                        });
                        
                        // Handle file selection - UPDATED to use authenticatedUploadFace
                        fileInput.addEventListener('change', async (event) => {
                        const file = event.target.files[0];
                            if (file) {
                                const currentUser = window.getCurrentUser();
                                if (currentUser) {
                                    try {
                                        // Check if there's an existing face in this slot
                                        const existingFace = savedFaces.find(face => face.face_number === slotIndex + 1);
                                        if (existingFace) {
                                            // Delete the existing face first
                                            await removeUserFace(currentUser.id, slotIndex + 1);
                                        }

                                        // Now proceed with the new upload
                                        const url = await uploadUserFace(currentUser.id, file);
                                        console.log(`Face uploaded successfully for slot ${slotIndex + 1}:`, url);
                                        
                                        // Update the button UI with the new image
                                        faceButton.textContent = ''; // Clear existing content
                                        const img = document.createElement('img');
                                        img.crossOrigin = "anonymous";
                                        img.src = url;
                                        
                                        // Add error handling for image loading
                                        img.onerror = () => {
                                            console.error('Failed to load image:', url);
                                            faceButton.textContent = 'Upload Face Slot ' + (slotIndex + 1);
                                        };
                                        
                                        faceButton.appendChild(img);

                                        // Add delete button for the new upload
                                        const deleteBtn = document.createElement('button');
                                        deleteBtn.className = 'delete-face-btn';
                                        deleteBtn.innerHTML = '×';
                                        deleteBtn.title = 'Delete face';
                                        
                                        // Handle delete button click
                                        deleteBtn.addEventListener('click', async (e) => {
                                            e.stopPropagation(); // Prevent triggering the file input click
                                            
                                            try {
                                                if (!currentUser) {
                                                    console.error('No user logged in');
                                                    return;
                                                }

                                                // Show confirmation dialog
                                                if (confirm('Are you sure you want to delete this face?')) {
                                                    deleteBtn.textContent = '...'; // Show loading state
                                                    await removeUserFace(currentUser.id, slotIndex + 1);
                                                    // Reset the button to upload state
                                                    faceButton.textContent = 'Upload Face Slot ' + (slotIndex + 1);
                                                }
                                            } catch (error) {
                                                console.error('Error deleting face:', error);
                                                alert('Failed to delete face. Please try again.');
                                            }
                                        });

                                        faceButton.appendChild(deleteBtn);

                                        // create a new row in the user_faces table
                                        await createUserFace(currentUser.id, url, slotIndex + 1);
                                        console.log('User face created successfully');
                                        
                                    } catch (error) {
                                        console.error(`Error handling face upload for slot ${slotIndex + 1}:`, error);
                                        faceButton.textContent = 'Upload Face Slot ' + (slotIndex + 1);
                                    }
                                } else {
                                    console.error('No user logged in to upload face');
                                }
                            }
                        });
                        
                        faceButtonsContainer.appendChild(faceButton);
                    }
                }
            };

            
            // Setup listener for auth state changes from header component
            const setupAuthChangeListener = () => {
                // Use MutationObserver to detect when the auth button text changes
                const authBtn = document.getElementById('authBtn');
                if (authBtn) {
                    const observer = new MutationObserver((mutations) => {
                        mutations.forEach((mutation) => {
                            if (mutation.type === 'characterData' || mutation.type === 'childList') {
                                const btnText = authBtn.textContent.trim();
                                if (btnText === 'Log In') {
                                    // User has been logged out, redirect to home
                                    window.location.href = 'index.html';
                                } else if (btnText === 'Log Out') {
                                    // User logged in, update profile
                                    updateProfileDisplay(window.getCurrentUser());
                                }
                            }
                        });
                    });
                    
                    observer.observe(authBtn, { 
                        characterData: true, 
                        childList: true, 
                        subtree: true 
                    });
                }
            };

            const unlockFacesButton = document.getElementById('unlockFacesButton');
            if (unlockFacesButton) {
                unlockFacesButton.addEventListener('click', async () => {
                    const currentUser = window.getCurrentUser();
                    if (!currentUser) {
                        console.error('No user logged in');
                        return;
                    }
                    
                    try {
                        // Use the userService from header.html
                        try {
                            // Get full user data using the userService exposed from header.html
                            const userData = await window.userService.getUserData(currentUser.id, true);
                            console.log('Complete user stats from users table:', userData);
                            
                            // Log specific fields if available
                            if (userData) {
                                // console.log('User ID:', userData.id);
                                // console.log('Credits:', userData.credits);
                                // console.log('Created at:', userData.created_at);
                                // console.log('All available fields in users table:', Object.keys(userData));
                                if(userData.credits >= 250 && userData.is_paid) {
                                    // Add confirmation dialog
                                    if (confirm('Are you sure you want to unlock 10 face slots for 250 credits?')) {
                                        // Subtract 250 credits from the user's balance
                                        await window.userService.updateUserCredits(currentUser.id, userData.credits - 250);
                                        await window.userService.updateUserFaceSlots(currentUser.id, userData.face_count + 10);
                                        console.log('======250 credits subtracted from user balance & 10 face slots unlocked======');
                                        
                                        // Get the updated face count
                                        const newFaceCount = await getFaceCount();
                                        
                                        // Clear and reinitialize the face buttons container
                                        const faceButtonsContainer = document.getElementById('faceButtonsContainer');
                                        if (faceButtonsContainer) {
                                            faceButtonsContainer.innerHTML = '';
                                            await initSavedFaces(newFaceCount);
                                        }

                                        // Update header credits display
                                        const headerCredits = document.getElementById('headerCredits');
                                        if (headerCredits) {
                                            headerCredits.textContent = userData.credits - 250;
                                        }

                                        // Update profile credits display
                                        const profileCredits = document.getElementById('profileCredits');
                                        if (profileCredits) {
                                            profileCredits.textContent = `CREDITS: ${userData.credits - 250}`;
                                        }
                                    }
                                } else {
                                    console.log('======Either not enough credits or not paid member======');
                                    alert('Cannot unlock face slots with free credits. Once credits are purchased you can unlock more face slots.');
                                }
                            }
                            
                            // You can also add a new helper function to header.html if needed
                            // Example of calling a hypothetical function exposed from header.html:
                            if (typeof window.getUserTableData === 'function') {
                                const fullUserData = await window.getUserTableData(currentUser.id);
                                console.log('Full user table data from helper function:', fullUserData);
                            }
                        } catch (error) {
                            console.error('Error fetching users table data:', error);
                        }
                        
                        // Log additional user metadata from auth
                        console.log('User auth metadata:', currentUser.user_metadata);
                        console.log('User created at:', currentUser.created_at);
                        console.log('User email:', currentUser.email);
                        
                    } catch (error) {
                        console.error('Error fetching user stats:', error);
                    }
                });
            }
            
            // Update profile display with user data
            const updateProfileDisplay = (user) => {
                if (!user) return;
                
                // Update username (from user metadata)
                if (profileUsername) {
                    const userMeta = user.user_metadata || {};
                    profileUsername.textContent = userMeta.username || user.email?.split('@')[0] || 'User';
                }
                
                // Update email
                if (profileEmail) {
                    profileEmail.textContent = user.email || 'No email available';
                }
                
                // Calculate membership duration in days
                if (profileSubscription && user.created_at) {
                    const signupDate = new Date(user.created_at);
                    const today = new Date();
                    const timeDiff = today.getTime() - signupDate.getTime();
                    const membershipDays = Math.floor(timeDiff / (1000 * 3600 * 24)) + 1;
                    
                    profileSubscription.textContent = `MEMBER FOR ${membershipDays} DAYS`;
                }
                
                // Get credits from header display with observer
                if (profileCredits) {
                    const headerCredits = document.getElementById('headerCredits');
                    if (headerCredits) {
                        // Set initial value (might be "?" if not loaded yet)
                        const initialCredits = headerCredits.textContent;
                        profileCredits.textContent = `CREDITS: ${initialCredits !== '?' ? initialCredits : '...'}`;
                        
                        // Create observer to watch for changes to the header credits element
                        const observer = new MutationObserver(() => {
                            // This function runs whenever the headerCredits element changes
                            const updatedCredits = headerCredits.textContent;
                            profileCredits.textContent = `CREDITS: ${updatedCredits !== '?' ? updatedCredits : '...'}`;
                        });
                        
                        // Start observing changes to the element's content
                        observer.observe(headerCredits, { 
                            characterData: true, 
                            childList: true, 
                            subtree: true 
                        });
                    }
                }
            };
            
            // Start checking if header is loaded
            checkHeaderLoaded();

            // Get face count from user table
            const getFaceCount = async () => {
                const currentUser = window.getCurrentUser();
                if (currentUser) {
                    try {
                        const faceCount = await window.userService.getFaceCount(currentUser.id);
                        console.log('Face count:', faceCount);
                        
                        // Update the face quota count in the UI
                        const faceQuotaCount = document.getElementById('faceQuotaCount');
                        if (faceQuotaCount) {
                            faceQuotaCount.textContent = faceCount || 0;
                        }
                        return faceCount;
                    } catch (error) {
                        console.error('Error getting face count:', error);
                    }
                }
            };
            
        });
    </script>
    <script src="/components.js"></script>
    <script>
    // Function to update the recent renders display
    function updateRecentRendersDisplay() {
        const recentRendersList = document.getElementById('recentRendersList');
        const renders = JSON.parse(localStorage.getItem('recentRenders') || '[]');
        
        if (renders.length === 0) {
            recentRendersList.innerHTML = '<p class="no-renders">No recent renders</p>';
            return;
        }
        
        recentRendersList.innerHTML = '';
        
        renders.forEach((render, index) => {
            const renderTime = new Date(render.timestamp).toLocaleString();
            const renderType = render.renderData.type === 'image/gif' ? 'GIF' : 'Video';
            
            const renderItem = document.createElement('div');
            renderItem.className = 'recent-render-item';
            
            renderItem.innerHTML = `
                <div class="render-info">
                    <strong>${render.title || 'Untitled Render'}</strong>
                    <small>${renderTime}</small><br>
                    <small>${renderType} - ${render.settings.resolution}</small>
                    <small>${Math.round(render.settings.duration)}s duration</small>
                </div>
            `;
            
            // Add a download button
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'download-btn';
            downloadBtn.innerHTML = 'Download';
            downloadBtn.onclick = () => {
                // Convert base64 back to blob
                const byteString = atob(render.renderData.data.split(',')[1]);
                const arrayBuffer = new ArrayBuffer(byteString.length);
                const uint8Array = new Uint8Array(arrayBuffer);
                
                for (let i = 0; i < byteString.length; i++) {
                    uint8Array[i] = byteString.charCodeAt(i);
                }
                
                const blob = new Blob([arrayBuffer], { type: render.renderData.type });
                const url = URL.createObjectURL(blob);
                
                // Create and click download link
                const a = document.createElement('a');
                a.href = url;
                a.download = `render-${new Date(render.timestamp).toISOString().slice(0,10)}.${renderType === 'GIF' ? 'gif' : 'mp4'}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                // Clean up the blob URL
                setTimeout(() => {
                    URL.revokeObjectURL(url);
                }, 100);
            };
            
            renderItem.appendChild(downloadBtn);
            recentRendersList.appendChild(renderItem);
        });
    }

    // Update the display when renders are updated
    window.addEventListener('rendersUpdated', updateRecentRendersDisplay);

    // Initial display update
    document.addEventListener('DOMContentLoaded', updateRecentRendersDisplay);
    </script>
