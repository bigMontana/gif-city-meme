<body>
    <div class="container">
        <div id="header-container"></div>

        <!-- Profile Content Container (Empty) -->
        <div class="profile-content">
            <div class="profile-top-bar">
                <div class="profile-info">
                    <div class="profile-username" id="profileUsername">Username</div>
                    <div class="profile-email" id="profileEmail">user@example.com</div>
                    <div class="profile-subscription" id="profileSubscription">MEMBER FOR 0 DAYS</div>
                    <div class="profile-credits" id="profileCredits">CREDITS: 0</div>
                </div>
            </div>
            
            <!-- Face Quota Container -->
            <div class="face-quota-container">
                <div class="face-quota-title">Saved Face Slots (<span id="faceQuotaCount">0</span>)</div>
                <div class="face-buttons-container" id="faceButtonsContainer">
                </div>
                <div class="unlockFacesButton">
                    <button id="unlockFacesButton">Unlock 10 Face Slots for 250 Credits</button>
                </div>
            </div>
        </div>

        <div id="footer-container"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script type="module" src="/src/supabase.js"></script>
   
    <script type="module">
        // Script for profile.html to work with the header component
        document.addEventListener('DOMContentLoaded', function() {
            // Profile elements
            const profileUsername = document.getElementById('profileUsername');
            const profileEmail = document.getElementById('profileEmail');
            const profileSubscription = document.getElementById('profileSubscription');
            const profileCredits = document.getElementById('profileCredits');
            
            // Check if header component is loaded
            const checkHeaderLoaded = () => {
                if (typeof window.getCurrentUser === 'function') {
                    initProfilePage();
                } else {
                    // Wait for header component to fully load
                    setTimeout(checkHeaderLoaded, 100);
                }
            };
            
            // Initialize profile page
            const initProfilePage = () => {
                // Get current user from header component
                const currentUser = window.getCurrentUser();
                
                if (currentUser) {
                    updateProfileDisplay(currentUser);
                    
                    // Setup auth state change listener
                    setupAuthChangeListener();
                } else {
                    // No user is logged in, redirect to home page
                    window.location.href = 'index.html';
                }
            };
            
            // Setup listener for auth state changes from header component
            const setupAuthChangeListener = () => {
                // Use MutationObserver to detect when the auth button text changes
                const authBtn = document.getElementById('authBtn');
                if (authBtn) {
                    const observer = new MutationObserver((mutations) => {
                        mutations.forEach((mutation) => {
                            if (mutation.type === 'characterData' || mutation.type === 'childList') {
                                const btnText = authBtn.textContent.trim();
                                if (btnText === 'Log In') {
                                    // User has been logged out, redirect to home
                                    window.location.href = 'index.html';
                                } else if (btnText === 'Log Out') {
                                    // User logged in, update profile
                                    updateProfileDisplay(window.getCurrentUser());
                                }
                            }
                        });
                    });
                    
                    observer.observe(authBtn, { 
                        characterData: true, 
                        childList: true, 
                        subtree: true 
                    });
                }
            };

            const unlockFacesButton = document.getElementById('unlockFacesButton');
            if (unlockFacesButton) {
                unlockFacesButton.addEventListener('click', async () => {
                    const currentUser = window.getCurrentUser();
                    if (!currentUser) {
                        console.error('No user logged in');
                        return;
                    }
                    
                    try {
                        // Use the userService from header.html
                        try {
                            // Get full user data using the userService exposed from header.html
                            const userData = await window.userService.getUserData(currentUser.id, true);
                            console.log('Complete user stats from users table:', userData);
                            
                            // Log specific fields if available
                            if (userData) {
                                console.log('User ID:', userData.id);
                                console.log('Credits:', userData.credits);
                                console.log('Created at:', userData.created_at);
                                console.log('All available fields in users table:', Object.keys(userData));
                            }
                            
                            // You can also add a new helper function to header.html if needed
                            // Example of calling a hypothetical function exposed from header.html:
                            if (typeof window.getUserTableData === 'function') {
                                const fullUserData = await window.getUserTableData(currentUser.id);
                                console.log('Full user table data from helper function:', fullUserData);
                            }
                        } catch (error) {
                            console.error('Error fetching users table data:', error);
                        }
                        
                        // Log additional user metadata from auth
                        console.log('User auth metadata:', currentUser.user_metadata);
                        console.log('User created at:', currentUser.created_at);
                        console.log('User email:', currentUser.email);
                        
                    } catch (error) {
                        console.error('Error fetching user stats:', error);
                    }
                });
            }
            
            // Update profile display with user data
            const updateProfileDisplay = (user) => {
                if (!user) return;
                
                // Update username (from user metadata)
                if (profileUsername) {
                    const userMeta = user.user_metadata || {};
                    profileUsername.textContent = userMeta.username || user.email?.split('@')[0] || 'User';
                }
                
                // Update email
                if (profileEmail) {
                    profileEmail.textContent = user.email || 'No email available';
                }
                
                // Calculate membership duration in days
                if (profileSubscription && user.created_at) {
                    const signupDate = new Date(user.created_at);
                    const today = new Date();
                    const timeDiff = today.getTime() - signupDate.getTime();
                    const membershipDays = Math.floor(timeDiff / (1000 * 3600 * 24)) + 1;
                    
                    profileSubscription.textContent = `MEMBER FOR ${membershipDays} DAYS`;
                }
                
                // Get credits from header display with observer
                if (profileCredits) {
                    const headerCredits = document.getElementById('headerCredits');
                    if (headerCredits) {
                        // Set initial value (might be "?" if not loaded yet)
                        const initialCredits = headerCredits.textContent;
                        profileCredits.textContent = `CREDITS: ${initialCredits !== '?' ? initialCredits : '...'}`;
                        
                        // Create observer to watch for changes to the header credits element
                        const observer = new MutationObserver(() => {
                            // This function runs whenever the headerCredits element changes
                            const updatedCredits = headerCredits.textContent;
                            profileCredits.textContent = `CREDITS: ${updatedCredits !== '?' ? updatedCredits : '...'}`;
                        });
                        
                        // Start observing changes to the element's content
                        observer.observe(headerCredits, { 
                            characterData: true, 
                            childList: true, 
                            subtree: true 
                        });
                    }
                }
            };
            
            // Start checking if header is loaded
            checkHeaderLoaded();
        });
    </script>
    <script src="/components.js"></script>
</body>
</html>
