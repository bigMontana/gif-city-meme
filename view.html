<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Viewer</title>
    <!-- Load FFmpeg scripts with proper order and defer attributes -->
    <script src="./ffmpeg/ffmpeg.min.js" defer></script>
    <script defer>
        // This ensures FFmpeg scripts are loaded in the correct order
        window.addEventListener('DOMContentLoaded', () => {
            // Load core scripts dynamically with correct sequence
            const loadScript = (src, callback) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = callback;
                document.head.appendChild(script);
            };
            
            // First load core.js, then worker.js
            loadScript('/ffmpeg/ffmpeg-core.js', () => {
                loadScript('/ffmpeg/ffmpeg-core.worker.js', () => {
                    console.log('FFmpeg scripts loaded in correct sequence');
                    // Dispatch an event to notify the app
                    document.dispatchEvent(new Event('ffmpeg-scripts-loaded'));
                });
            });
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            text-align: center;
            position: relative;
        }

        #video-container {
            position: relative;
            transform-style: preserve-3d;
            max-width: 100%;
            margin: 0 auto;
        }

        #memeVideo {
            width: 100%;
            height: auto;
            display: block;
        }

        #overlay {
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: 50% 100%;
            will-change: transform;
            width: 100px;
            height: 100px;
            background: rgba(255, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }

        #overlayImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #renderCanvas {
            width: 100%;
            height: auto;
            display: block;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #status {
            margin-top: 10px;
            color: #666;
        }

        .scrubber-container {
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        #videoScrubber {
            width: 100%;
            height: 20px;
            margin: 20px 0;
            cursor: pointer;
        }

        /* Style the slider thumb */
        #videoScrubber::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 25px;
            background: #007bff;
            cursor: pointer;
            border-radius: 3px;
        }

        #videoScrubber::-moz-range-thumb {
            width: 15px;
            height: 25px;
            background: #007bff;
            cursor: pointer;
            border-radius: 3px;
            border: none;
        }

        .toggle-button {
            background-color: #dc3545;
        }
        
        .toggle-button.active {
            background-color: #28a745;
        }

        /* Add styles for the new FFmpeg button */
        .ffmpeg-button {
            background-color: #6610f2;
            margin-left: 10px;
        }
        
        .ffmpeg-button:hover {
            background-color: #520dc2;
        }

        .upload-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
        }

        .image-upload-button {
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .image-upload-button:hover {
            transform: scale(1.05);
            border-color: #0056b3 !important;
        }

        /* Add delete button hover effect */
        button[style*="position: absolute"] {
            transition: background-color 0.2s, transform 0.2s;
        }

        button[style*="position: absolute"]:hover {
            background-color: rgba(0, 0, 0, 0.8) !important;
            transform: scale(1.05);
        }
        
        /* Loading spinner for FFmpeg initialization */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Disabled button styles */
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .upload-file-button {
            padding: 8px 16px;
            font-size: 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .upload-file-button:hover {
            background-color: #218838;
        }

        .file-upload-container {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="file-upload-container" style="margin-bottom: 20px;">
            <input type="file" id="videoUpload" accept="video/*" style="display: none;">
            <input type="file" id="jsonUpload" accept=".json" style="display: none;">
            <button id="videoUploadButton" class="upload-file-button">
                Load Video
            </button>
            <span id="videoFileName" style="margin-left: 10px; color: #666;"></span>
            <button id="jsonUploadButton" class="upload-file-button" style="margin-left: 10px;">
                Load JSON
            </button>
            <span id="jsonFileName" style="margin-left: 10px; color: #666;"></span>
        </div>
        <div id="video-container">
            <canvas id="renderCanvas"></canvas>
        </div>
        <div class="upload-container"></div>
        <button id="ffmpegButton" class="ffmpeg-button" disabled>
            Render with FFmpeg
            <span id="ffmpegSpinner" class="loading-spinner" style="display: none;"></span>
        </button>
        
        <!-- Add video scrubber -->
        <div class="scrubber-container">
            <div id="frameMarkers" class="frame-markers"></div>
            <input type="range" 
                   id="videoScrubber" 
                   min="0" 
                   max="0" 
                   value="0" 
                   step="1" 
                   style="width: 100%; margin: 20px 0;">
        </div>
        
        <div id="status"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('renderCanvas');
            const ctx = canvas.getContext('2d');
            const video = document.createElement('video');
            const statusDiv = document.getElementById('status');
            const ffmpegButton = document.getElementById('ffmpegButton');
            const ffmpegSpinner = document.getElementById('ffmpegSpinner');
            const scrubber = document.getElementById('videoScrubber');
            video.src = '02_chairShot.mp4';
            let frameData = {};
            let currentFrame = 0;
            let mediaRecorder;
            let chunks = [];
            let originalFrameData = {};
            let isOffsetActive = false;
            let imageButtons = new Map();
            let maskImagesCache = null;
            let audioContext = null;
            let audioSource = null;
            let audioDestination = null;
            
            // Add logo image loading at the top with other initializations
            const logoImage = new Image();
            logoImage.onload = () => {
                if (video.readyState >= 2) {
                    drawFrame();
                }
            };
            logoImage.src = 'xlogo2.png';
            
            // Update JSON fetch
            fetch('chairShot2.json')
                .then(response => response.json())
                .then(data => {
                    const uploadContainer = document.querySelector('.upload-container');
                    uploadContainer.innerHTML = ''; // Clear existing content
                    uploadContainer.style.display = 'flex';
                    uploadContainer.style.flexDirection = 'column';
                    uploadContainer.style.gap = '20px';
                    uploadContainer.style.margin = '20px 0';

                    // Process each face
                    if (data.faces) {
                        Object.entries(data.faces).forEach(([faceId, faceData]) => {
                            // Create face container
                            const faceContainer = document.createElement('div');
                            faceContainer.className = 'face-container';
                            faceContainer.style.padding = '15px';
                            faceContainer.style.backgroundColor = 'rgba(255, 255, 255, 0.8)';
                            faceContainer.style.borderRadius = '8px';

                            // Add face title
                            const faceTitle = document.createElement('h3');
                            faceTitle.textContent = `${faceId}`;
                            faceTitle.style.marginBottom = '10px';
                            faceContainer.appendChild(faceTitle);

                            // Create image buttons container for this face
                            const imageButtonsContainer = document.createElement('div');
                            imageButtonsContainer.style.display = 'flex';
                            imageButtonsContainer.style.flexWrap = 'wrap';
                            imageButtonsContainer.style.gap = '10px';
                            imageButtonsContainer.style.justifyContent = 'center';

                            // Collect unique image names for this face
                            const uniqueImageNames = new Set(['Default']);
                            Object.values(faceData).forEach(frame => {
                                if (frame.imageName) {
                                    uniqueImageNames.add(frame.imageName);
                                }
                            });

                            // Create image buttons for this face
                            uniqueImageNames.forEach(imageName => {
                                const buttonContainer = document.createElement('div');
                                buttonContainer.style.display = 'flex';
                                buttonContainer.style.flexDirection = 'column';
                                buttonContainer.style.alignItems = 'center';
                                buttonContainer.style.gap = '5px';
                                buttonContainer.style.position = 'relative';

                                const imgButton = document.createElement('img');
                                imgButton.className = 'image-upload-button';
                                imgButton.style.width = '100px';
                                imgButton.style.height = '100px';
                                imgButton.style.objectFit = 'cover';
                                imgButton.style.cursor = 'pointer';
                                imgButton.style.border = '2px solid #007bff';
                                imgButton.style.borderRadius = '5px';

                                // Create file input first
                                const fileInput = document.createElement('input');
                                fileInput.type = 'file';
                                fileInput.accept = 'image/*';
                                fileInput.style.display = 'none';
                                fileInput.dataset.faceId = faceId;
                                fileInput.dataset.imageName = imageName;

                                // Set default image or placeholder
                                if (imageName === 'Default') {
                                    imgButton.src = 'GERGFACE.png';
                                } else {
                                    imgButton.src = 'data:image/svg+xml,' + encodeURIComponent(`
                                        <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
                                            <rect width="100%" height="100%" fill="#f0f0f0"/>
                                            <text x="50%" y="50%" font-family="Arial" font-size="12" 
                                                fill="#666" text-anchor="middle" dy=".3em">Click to Upload</text>
                                        </svg>
                                    `);
                                }

                                // Add delete button
                                const deleteBtn = document.createElement('button');
                                deleteBtn.innerHTML = '×';
                                deleteBtn.style.position = 'absolute';
                                deleteBtn.style.top = '5px';
                                deleteBtn.style.right = '5px';
                                deleteBtn.style.width = '24px';
                                deleteBtn.style.height = '24px';
                                deleteBtn.style.borderRadius = '6px';
                                deleteBtn.style.border = 'none';
                                deleteBtn.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
                                deleteBtn.style.color = 'white';
                                deleteBtn.style.cursor = 'pointer';
                                deleteBtn.style.display = 'none';  // Always start hidden
                                deleteBtn.style.alignItems = 'center';
                                deleteBtn.style.justifyContent = 'center';
                                deleteBtn.style.fontSize = '18px';
                                deleteBtn.style.fontWeight = '500';
                                deleteBtn.style.padding = '0';
                                deleteBtn.style.zIndex = '1';
                                deleteBtn.style.transition = 'all 0.2s ease';

                                // Add delete functionality
                                deleteBtn.addEventListener('click', (e) => {
                                    e.stopPropagation();
                                    // Reset to placeholder image
                                    imgButton.src = 'data:image/svg+xml,' + encodeURIComponent(`
                                        <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
                                            <rect width="100%" height="100%" fill="#f0f0f0"/>
                                            <text x="50%" y="50%" font-family="Arial" font-size="12" 
                                                fill="#666" text-anchor="middle" dy=".3em">Click to Upload</text>
                                        </svg>
                                    `);
                                    deleteBtn.style.display = 'none';
                                    // Clear the file input value so it can be reused
                                    fileInput.value = '';
                                    // Update the imageButtons map with the placeholder
                                    imageButtons.set(`${faceId}_${imageName}`, imgButton);
                                    drawFrame();
                                });

                                // File input change handler
                                fileInput.addEventListener('change', (e) => {
                                    const file = e.target.files[0];
                                    if (file) {
                                        const reader = new FileReader();
                                        reader.onload = (e) => {
                                            const img = new Image();
                                            img.onload = () => {
                                                imgButton.src = e.target.result;
                                                deleteBtn.style.display = 'flex'; // Show delete button
                                                imageButtons.set(`${faceId}_${imageName}`, imgButton);
                                                drawFrame();
                                                requestAnimationFrame(drawFrame);
                                            };
                                            img.src = e.target.result;
                                        };
                                        reader.readAsDataURL(file);
                                    }
                                });

                                imgButton.addEventListener('click', () => {
                                    fileInput.click();
                                });

                                const label = document.createElement('div');
                                label.textContent = imageName;
                                label.style.fontSize = '14px';
                                label.style.color = '#666';

                                buttonContainer.appendChild(imgButton);
                                buttonContainer.appendChild(deleteBtn);
                                buttonContainer.appendChild(label);
                                buttonContainer.appendChild(fileInput);
                                imageButtonsContainer.appendChild(buttonContainer);

                                // Store the image button reference
                                imageButtons.set(`${faceId}_${imageName}`, imgButton);
                            });

                            faceContainer.appendChild(imageButtonsContainer);
                            uploadContainer.appendChild(faceContainer);
                        });
                    }

                    // Continue with initialization
                    originalFrameData = data;
                    frameData = data.faces?.face1 || {};
                    
                    // Handle video loading
                    video.addEventListener('loadedmetadata', () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        
                        // Set up scrubber
                        const totalFrames = Math.floor(video.duration * 30);
                        scrubber.max = totalFrames - 1;
                        
                        // Simple scrubber event handler
                        scrubber.addEventListener('input', () => {
                            currentFrame = parseInt(scrubber.value);
                            video.currentTime = currentFrame / 30;
                        });
                        
                        // Start at first frame
                        video.currentTime = 0;
                    });

                    // Update scrubber position when video time updates
                    video.addEventListener('timeupdate', () => {
                        currentFrame = Math.floor(video.currentTime * 30);
                        scrubber.value = currentFrame;
                        drawFrame();
                    });

                    // Draw frame when video has seeked to new position
                    video.addEventListener('seeked', () => {
                        drawFrame();
                    });
                })
                .catch(error => {
                    console.error('Error loading JSON:', error);
                    alert('Error loading overlay data');
                });

            function drawFrame() {
                if (video.readyState >= 2) {
                    // Ensure currentFrame is within valid bounds
                    const videoFPS = 30;
                    const maxFrame = Math.floor(video.duration * videoFPS) - 1;
                    
                    if (currentFrame > maxFrame) {
                        currentFrame = maxFrame;
                        scrubber.value = currentFrame;
                    }
                    
                    // Clear canvas and draw video frame once
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // Draw all faces from the original data structure
                    if (originalFrameData.faces) {
                        // Pre-load mask images to avoid async issues
                        const maskImages = new Map();
                        
                        Object.entries(originalFrameData.faces).forEach(([faceId, faceData]) => {
                            const data = getFrameData(currentFrame, faceData);
                            if (data) {
                                ctx.save();
                                ctx.translate(data.position.x, data.position.y);
                                const finalScaleX = data.scale * data.scaleX * (data.xFlip ? -1 : 1);
                                const finalScaleY = data.scale * data.scaleY;
                                ctx.rotate(data.rotation * Math.PI / 180);
                                ctx.scale(finalScaleX, finalScaleY);

                                // Create a temporary canvas for the face and mask
                                const tempCanvas = document.createElement('canvas');
                                tempCanvas.width = 200;
                                tempCanvas.height = 200;
                                const tempCtx = tempCanvas.getContext('2d');

                                // Draw the face onto the temporary canvas
                                const imageName = data.imageName || 'Default';
                                const imageElement = imageButtons.get(`${faceId}_${imageName}`);

                                // Check if we have a valid image, if not fall back to default
                                let imageToUse = imageElement;
                                if (!imageElement || imageElement.src.includes('data:image/svg+xml')) {
                                    // If no image or it's the placeholder SVG, use the default image
                                    imageToUse = imageButtons.get(`${faceId}_Default`);
                                }

                                if (imageToUse && imageToUse.complete) {
                                    // Clear the temporary canvas first
                                    tempCtx.clearRect(0, 0, 200, 200);
                                    // Draw the face
                                    tempCtx.drawImage(imageToUse, 0, 0, 200, 200);
                                }

                                // Apply masking
                                if (data.maskPoints && data.maskPoints.length > 0) {
                                    // Create a path for the mask using existing code
                                    tempCtx.beginPath();
                                    tempCtx.rect(0, 0, 200, 200);
                                    
                                    tempCtx.beginPath();
                                    const firstPoint = data.maskPoints[0];
                                    tempCtx.moveTo(firstPoint.x, firstPoint.y);
                                    
                                    for (let i = 1; i < data.maskPoints.length; i++) {
                                        const point = data.maskPoints[i];
                                        if (point.controlPoint1 && point.controlPoint2) {
                                            tempCtx.bezierCurveTo(
                                                point.controlPoint1.x, point.controlPoint1.y,
                                                point.controlPoint2.x, point.controlPoint2.y,
                                                point.x, point.y
                                            );
                                        } else if (point.controlPoint1) {
                                            tempCtx.quadraticCurveTo(
                                                point.controlPoint1.x, point.controlPoint1.y,
                                                point.x, point.y
                                            );
                                        } else {
                                            tempCtx.lineTo(point.x, point.y);
                                        }
                                    }
                                    
                                    tempCtx.closePath();
                                    tempCtx.clip("evenodd");
                                } else if (data.maskDataURL) {
                                    // Check if we've already processed this mask URL
                                    if (!maskImagesCache) {
                                        maskImagesCache = new Map();
                                    }
                                    
                                    let maskImg = maskImagesCache.get(data.maskDataURL);
                                    
                                    if (!maskImg) {
                                        maskImg = new Image();
                                        maskImg.src = data.maskDataURL;
                                        maskImagesCache.set(data.maskDataURL, maskImg);
                                    }
                                    
                                    if (maskImg.complete) {
                                        // Apply the mask to the temporary canvas
                                        tempCtx.globalCompositeOperation = 'destination-out';
                                        tempCtx.drawImage(maskImg, 0, 0, 200, 200);
                                        tempCtx.globalCompositeOperation = 'source-over';  // Reset composite operation
                                    } else {
                                        maskImg.onload = () => {
                                            requestAnimationFrame(drawFrame);
                                        };
                                    }
                                }

                                // Draw the masked face onto the main canvas
                                ctx.drawImage(tempCanvas, -100, -100, 200, 200);
                                
                                ctx.restore();
                            }
                        });
                    }

                    // Draw logo if needed
                    if (logoImage.complete) {
                        const padding = 40;
                        const logoWidth = Math.round(canvas.width * 0.15);  // 6% of video width
                        const logoHeight = logoWidth;  // Keep aspect ratio square
                        
                        // Set up shadow
                        ctx.save();
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                        ctx.shadowBlur = 20;
                        ctx.shadowOffsetX = 5;
                        ctx.shadowOffsetY = 5;
                        
                        ctx.drawImage(logoImage, 
                            padding,
                            canvas.height - logoHeight - padding,
                            logoWidth,
                            logoHeight
                        );
                        ctx.restore();
                    }
                }
            }

            function getFrameData(frame, faceData) {
                frame = Math.floor(frame);
                
                const keyframes = Object.keys(faceData)
                    .map(Number)
                    .sort((a, b) => a - b);
                
                // Find the surrounding keyframes
                const nextKeyframeIndex = keyframes.findIndex(kf => kf > frame);
                
                // If this is an exact keyframe, return that frame's data directly
                if (keyframes.includes(frame)) {
                    return faceData[frame];
                }
                
                // Handle edge cases
                if (nextKeyframeIndex === -1) return {
                    ...faceData[keyframes[keyframes.length - 1]],
                    maskPoints: [],
                    maskDataURL: null
                };
                if (nextKeyframeIndex === 0) return {
                    ...faceData[keyframes[0]],
                    maskPoints: [],
                    maskDataURL: null
                };
                
                const prevKeyframe = keyframes[nextKeyframeIndex - 1];
                const nextKeyframe = keyframes[nextKeyframeIndex];
                
                // Calculate interpolation factor (0 to 1)
                const factor = (frame - prevKeyframe) / (nextKeyframe - prevKeyframe);
                
                // Get the data for both keyframes
                const prevData = faceData[prevKeyframe];
                const nextData = faceData[nextKeyframe];
                
                // Return interpolated data without any mask data
                return {
                    position: {
                        x: lerp(prevData.position.x, nextData.position.x, factor),
                        y: lerp(prevData.position.y, nextData.position.y, factor)
                    },
                    scale: lerp(prevData.scale, nextData.scale, factor),
                    scaleX: lerp(prevData.scaleX, nextData.scaleX, factor),
                    scaleY: lerp(prevData.scaleY, nextData.scaleY, factor),
                    rotation: lerpAngle(prevData.rotation, nextData.rotation, factor),
                    xFlip: prevData.xFlip,
                    hidden: prevData.hidden,
                    imageName: prevData.imageName || 'Default',
                    // No mask data for interpolated frames
                    maskPoints: [],
                    maskDataURL: null
                };
            }
            
            // Linear interpolation helper function with cubic easing
            function lerp(start, end, factor) {
                // Cubic easing function
                factor = factor * factor * (3 - 2 * factor);
                return start + (end - start) * factor;
            }
            
            // Special interpolation for angles to handle wraparound
            function lerpAngle(start, end, factor) {
                let diff = end - start;
                // Handle angle wraparound
                if (diff > 180) diff -= 360;
                if (diff < -180) diff += 360;
                // Apply cubic easing to angle interpolation
                factor = factor * factor * (3 - 2 * factor);
                return start + diff * factor;
            }

            video.addEventListener('play', function() {
                function step() {
                    drawFrame();
                    if (!video.paused && !video.ended) {
                        requestAnimationFrame(step);
                    }
                }
                requestAnimationFrame(step);
            });

            // Global FFmpeg state tracking
            let ffmpegState = {
                minLoaded: false,
                coreLoaded: false,
                workerLoaded: false,
                wasmLoaded: false,
                ffmpeg: null,
                initAttempts: 0
            };

            // Sequential loading with proper dependencies
            function loadFFmpegScriptsSequentially() {
                ffmpegSpinner.style.display = 'inline-block';
                ffmpegButton.disabled = true;
                statusDiv.textContent = 'Starting FFmpeg initialization...';
                
                // Step 1: Load the main FFmpeg min script
                const loadMinScript = () => {
                    return new Promise((resolve, reject) => {
                        if (ffmpegState.minLoaded) return resolve();
                        
                        statusDiv.textContent = 'Loading FFmpeg main script...';
                        const script = document.createElement('script');
                        script.src = '/ffmpeg/ffmpeg.min.js';
                        script.onload = () => {
                            console.log('FFmpeg min script loaded');
                            ffmpegState.minLoaded = true;
                            setTimeout(resolve, 500);
                        };
                        script.onerror = (err) => reject(new Error('Failed to load FFmpeg min script'));
                        document.head.appendChild(script);
                    });
                };
                
                // Step 2: Pre-load the core script
                const preloadCoreScript = () => {
                    return new Promise((resolve, reject) => {
                        if (ffmpegState.coreLoaded) return resolve();
                        
                        statusDiv.textContent = 'Pre-loading FFmpeg core script...';
                        const script = document.createElement('script');
                        script.src = '/ffmpeg/ffmpeg-core.js';
                        script.onload = () => {
                            console.log('FFmpeg core script pre-loaded');
                            ffmpegState.coreLoaded = true;
                            setTimeout(resolve, 500);
                        };
                        script.onerror = (err) => reject(new Error('Failed to pre-load FFmpeg core script'));
                        document.head.appendChild(script);
                    });
                };
                
                // Step 3: Initialize FFmpeg
                const initializeFFmpeg = async () => {
                    if (ffmpegState.ffmpeg && ffmpegState.ffmpeg.isLoaded()) {
                        return ffmpegState.ffmpeg;
                    }
                    
                    statusDiv.textContent = 'Creating FFmpeg instance...';
                    ffmpegState.initAttempts++;
                    
                    try {
                        const ffmpeg = FFmpeg.createFFmpeg({
                            log: true,
                            corePath: '/ffmpeg/ffmpeg-core.js',
                            workerPath: '/ffmpeg/ffmpeg-core.worker.js',
                            wasmPath: '/ffmpeg/ffmpeg-core.wasm'
                        });
                        
                        window.addEventListener('error', function(e) {
                            if (e.message.includes('worker.js received unknown command undefined')) {
                                console.log('Ignoring known FFmpeg worker warning');
                                e.preventDefault();
                                return true;
                            }
                        }, true);
                        
                        statusDiv.textContent = 'Loading FFmpeg WASM and Worker...';
                        
                    const loadPromise = ffmpeg.load();
                    const timeoutPromise = new Promise((_, reject) => {
                        setTimeout(() => reject(new Error('FFmpeg initialization timed out')), 30000);
                    });
                    
                    await Promise.race([loadPromise, timeoutPromise]);
                    
                        console.log('FFmpeg fully loaded and ready!');
                    statusDiv.textContent = 'FFmpeg initialized successfully';
                        ffmpegState.ffmpeg = ffmpeg;
                    ffmpegButton.disabled = false;
                    ffmpegSpinner.style.display = 'none';
                    return ffmpeg;
                } catch (error) {
                        console.error('FFmpeg initialization error:', error);
                        
                        if (ffmpegState.initAttempts >= 3) {
                            throw new Error(`FFmpeg failed to initialize after ${ffmpegState.initAttempts} attempts: ${error.message}`);
                        }
                        
                        const backoffTime = Math.pow(2, ffmpegState.initAttempts) * 1000;
                        statusDiv.textContent = `Retrying FFmpeg initialization in ${backoffTime/1000}s...`;
                        
                        await new Promise(resolve => setTimeout(resolve, backoffTime));
                        return initializeFFmpeg();
                    }
                };
                
                return loadMinScript()
                    .then(() => preloadCoreScript())
                    .then(() => initializeFFmpeg())
                    .catch(error => {
                        console.error('FFmpeg loading sequence failed:', error);
                        statusDiv.textContent = `Failed to initialize FFmpeg: ${error.message}`;
                        ffmpegSpinner.style.display = 'none';
                        
                        ffmpegButton.disabled = false;
                        ffmpegButton.textContent = 'Retry FFmpeg Initialization';
                        
                        ffmpegButton.onclick = () => {
                            ffmpegButton.textContent = 'Render with FFmpeg';
                            ffmpegState = {
                                minLoaded: ffmpegState.minLoaded,
                                coreLoaded: ffmpegState.coreLoaded,
                                workerLoaded: false,
                                wasmLoaded: false,
                                ffmpeg: null,
                                initAttempts: 0
                            };
                            loadFFmpegScriptsSequentially();
                        };
                        
                        throw error;
                    });
            }

            // Initialize FFmpeg when page loads
            setTimeout(() => {
                loadFFmpegScriptsSequentially().catch(err => {
                    console.error('Initial FFmpeg loading failed, will retry on button click:', err);
                });
            }, 2000);

            // Update FFmpeg button click handler
            ffmpegButton.addEventListener('click', async () => {
                if (ffmpegState.ffmpeg && ffmpegState.ffmpeg.isLoaded()) {
                    renderWithFFmpeg();
                    return;
                }
                
                try {
                    await loadFFmpegScriptsSequentially();
                    renderWithFFmpeg();
                    } catch (error) {
                    console.error('Could not initialize FFmpeg:', error);
                }
            });

            // Update the renderWithFFmpeg function with better audio handling
            async function renderWithFFmpeg() {
                const ffmpeg = ffmpegState.ffmpeg;
                statusDiv.textContent = 'Capturing frames...';
                
                // Reset video to start
                video.currentTime = 0;
                await new Promise(resolve => video.addEventListener('seeked', resolve, { once: true }));
                
                const frames = [];
                const totalFrames = Math.floor(video.duration * 30);
                
                // Function to capture a single frame
                function captureFrame() {
                    drawFrame();
                    return new Promise(resolve => {
                        requestAnimationFrame(() => {
                            canvas.toBlob(blob => {
                                frames.push(blob);
                                resolve();
                            }, 'image/jpeg', 0.95);
                        });
                    });
                }

                try {
                    // Capture all frames with proper timing
                    for (let i = 0; i < totalFrames; i++) {
                        video.currentTime = i / 30;
                        // Wait for the video to actually seek to the new time
                        await new Promise(resolve => {
                            const onSeeked = () => {
                                video.removeEventListener('seeked', onSeeked);
                                resolve();
                            };
                            video.addEventListener('seeked', onSeeked);
                        });
                        // Wait for the next frame to be rendered
                        await new Promise(resolve => requestAnimationFrame(resolve));
                        await captureFrame();
                        
                        // Update progress
                        statusDiv.textContent = `Capturing frames: ${Math.floor((i / totalFrames) * 100)}%`;
                    }

                    statusDiv.textContent = 'Processing frames with FFmpeg...';

                    // Write frames to FFmpeg filesystem
                    for (let i = 0; i < frames.length; i++) {
                        const frameName = `frame${i.toString().padStart(4, '0')}.jpg`;
                        const frameData = new Uint8Array(await frames[i].arrayBuffer());
                        ffmpeg.FS('writeFile', frameName, frameData);
                        
                        if (i % 30 === 0) {
                            console.log(`Writing frame ${i} of ${frames.length}`);
                        }
                    }

                    // Clean up any existing audio connections more thoroughly
                    if (audioSource) {
                        audioSource.disconnect();
                        audioSource = null;
                    }
                    if (audioContext) {
                        await audioContext.close();
                        audioContext = null;
                    }
                    
                    // Create a completely new video element for audio extraction
                    // This avoids the "already connected" issue
                    const tempVideo = document.createElement('video');
                    tempVideo.src = video.src;
                    tempVideo.muted = false;
                    tempVideo.volume = 1.0;
                    
                    // Wait for the temp video to be ready
                    await new Promise(resolve => {
                        tempVideo.onloadedmetadata = resolve;
                        tempVideo.load();
                    });
                    
                    // Create new audio context and connections with the temp video
                    audioContext = new AudioContext();
                    audioSource = audioContext.createMediaElementSource(tempVideo);
                    audioDestination = audioContext.createMediaStreamDestination();
                    audioSource.connect(audioDestination);
                    
                    // Record audio
                    const audioTrack = audioDestination.stream.getAudioTracks()[0];
                    const mediaRecorder = new MediaRecorder(new MediaStream([audioTrack]));
                    const audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.start();
                    
                    // Play the temp video to extract audio
                    tempVideo.currentTime = 0;
                    await new Promise(resolve => {
                        tempVideo.onended = resolve;
                        tempVideo.play();
                    });
                    
                    mediaRecorder.stop();
                    await new Promise(resolve => mediaRecorder.onstop = resolve);
                    
                    // Clean up audio connections
                    audioSource.disconnect();
                    audioSource = null;
                    await audioContext.close();
                    audioContext = null;
                    
                    // Clean up temp video
                    tempVideo.pause();
                    tempVideo.src = '';
                    
                    // Process the audio data
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioData = new Uint8Array(await audioBlob.arrayBuffer());
                    ffmpeg.FS('writeFile', 'audio.webm', audioData);

                    // Update FFmpeg command to ensure proper frame handling
                    await ffmpeg.run(
                        // Input frames
                        '-framerate', '30',
                        '-pattern_type', 'sequence',
                        '-i', 'frame%04d.jpg',
                        // Input audio
                        '-i', 'audio.webm',
                        // Output options
                        '-c:v', 'libx264',
                        '-pix_fmt', 'yuv420p',
                        '-preset', 'medium',
                        '-crf', '23',
                        '-c:a', 'aac',
                        '-b:a', '128k',
                        '-movflags', '+faststart',
                        'output.mp4'
                    );

                    // Read the output file
                    const data = ffmpeg.FS('readFile', 'output.mp4');

                    // Clean up files
                    frames.forEach((_, i) => {
                        const frameName = `frame${i.toString().padStart(4, '0')}.jpg`;
                        ffmpeg.FS('unlink', frameName);
                    });
                    ffmpeg.FS('unlink', 'audio.webm');
                    ffmpeg.FS('unlink', 'output.mp4');

                    // Create download link
                    const blob = new Blob([data.buffer], { type: 'video/mp4' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'meme_ffmpeg.mp4';
                    document.body.appendChild(a);
                    a.click();
                    
                    // Clean up
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 100);

                    statusDiv.textContent = `FFmpeg export complete! File size: ${(blob.size / 1024 / 1024).toFixed(2)} MB`;

                } catch (error) {
                    // Clean up audio on error
                    if (audioSource) {
                        audioSource.disconnect();
                        audioSource = null;
                    }
                    if (audioContext) {
                        await audioContext.close();
                        audioContext = null;
                    }
                    console.error('FFmpeg processing error:', error);
                    statusDiv.textContent = 'FFmpeg processing failed: ' + error.message;
                }
            }

            // Add new file input elements
            const videoUpload = document.getElementById('videoUpload');
            const jsonUpload = document.getElementById('jsonUpload');
            const videoUploadButton = document.getElementById('videoUploadButton');
            const jsonUploadButton = document.getElementById('jsonUploadButton');
            const videoFileName = document.getElementById('videoFileName');
            const jsonFileName = document.getElementById('jsonFileName');

            // Video upload handling
            videoUploadButton.addEventListener('click', () => videoUpload.click());
            videoUpload.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    videoFileName.textContent = file.name;
                    const videoUrl = URL.createObjectURL(file);
                    
                    // Reset important state variables
                    currentFrame = 0;
                    
                    // Only revoke the old URL after setting the new one
                    const oldSrc = video.src;
                    video.src = videoUrl;
                    
                    // Clean up old URL when video loads
                    video.onloadedmetadata = () => {
                        // Resize canvas
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        
                        // Calculate total frames based on duration
                        const videoFPS = 30; // Default assumption
                        const totalFrames = Math.floor(video.duration * videoFPS);
                        scrubber.max = totalFrames - 1;
                        
                        // Important: Check if we need to reset or adjust frame data for the new video
                        if (originalFrameData && originalFrameData.faces) {
                            // Create empty placeholder frame data if no new JSON is loaded
                            const resetFrameData = {};
                            
                            // For each face in the original data
                            Object.keys(originalFrameData.faces).forEach(faceId => {
                                resetFrameData[faceId] = {};
                                
                                // Create a default keyframe at 0
                                if (originalFrameData.faces[faceId][0]) {
                                    resetFrameData[faceId][0] = {...originalFrameData.faces[faceId][0]};
                                } else {
                                    // Create a default entry if none exists
                                    resetFrameData[faceId][0] = {
                                        position: { x: canvas.width/2, y: canvas.height/2 },
                                        scale: 1,
                                        scaleX: 1,
                                        scaleY: 1,
                                        rotation: 0,
                                        xFlip: false,
                                        hidden: false,
                                        imageName: 'Default',
                                        maskPoints: [],
                                        maskDataURL: null
                                    };
                                }
                                
                                // Add a frame at the end to ensure coverage
                                resetFrameData[faceId][totalFrames - 1] = {
                                    ...resetFrameData[faceId][0]
                                };
                            });
                            
                            // Only update if no new JSON was uploaded
                            if (!jsonUpload.files.length) {
                                const updatedData = {
                                    ...originalFrameData,
                                    faces: resetFrameData
                                };
                                
                                originalFrameData = updatedData;
                                frameData = updatedData.faces?.face1 || {};
                            }
                        }
                        
                        // Reset to first frame
                    video.currentTime = 0;
                        
                        // Clean up old URL
                        if (oldSrc && oldSrc.startsWith('blob:')) {
                            URL.revokeObjectURL(oldSrc);
                        }
                        
                        // Force a redraw
                        drawFrame();
                    };
                    
                    // Handle errors during loading
                    video.onerror = () => {
                        console.error('Error loading video:', video.error);
                        videoFileName.textContent = 'Error loading video';
                        videoFileName.style.color = '#dc3545';
                        URL.revokeObjectURL(videoUrl);
                    };
                }
            });

            // JSON upload handling
            jsonUploadButton.addEventListener('click', () => jsonUpload.click());
            jsonUpload.addEventListener('change', async (event) => {
                const file = event.target.files[0];
                if (file) {
                    jsonFileName.textContent = file.name;
                    try {
                        const text = await file.text();
                        const data = JSON.parse(text);
                        
                        // Update the upload container with new face data
                        const uploadContainer = document.querySelector('.upload-container');
                        uploadContainer.innerHTML = ''; // Clear existing content
                        uploadContainer.style.display = 'flex';
                        uploadContainer.style.flexDirection = 'column';
                        uploadContainer.style.gap = '20px';
                        uploadContainer.style.margin = '20px 0';

                        // Process faces from new JSON
                        if (data.faces) {
                            // Process each face
                            Object.entries(data.faces).forEach(([faceId, faceData]) => {
                                // Create face container
                                const faceContainer = document.createElement('div');
                                faceContainer.className = 'face-container';
                                faceContainer.style.padding = '15px';
                                faceContainer.style.backgroundColor = 'rgba(255, 255, 255, 0.8)';
                                faceContainer.style.borderRadius = '8px';

                                // Add face title
                                const faceTitle = document.createElement('h3');
                                faceTitle.textContent = `${faceId}`;
                                faceTitle.style.marginBottom = '10px';
                                faceContainer.appendChild(faceTitle);

                                // Create image buttons container for this face
                                const imageButtonsContainer = document.createElement('div');
                                imageButtonsContainer.style.display = 'flex';
                                imageButtonsContainer.style.flexWrap = 'wrap';
                                imageButtonsContainer.style.gap = '10px';
                                imageButtonsContainer.style.justifyContent = 'center';

                                // Collect unique image names for this face
                                const uniqueImageNames = new Set(['Default']);
                                Object.values(faceData).forEach(frame => {
                                    if (frame.imageName) {
                                        uniqueImageNames.add(frame.imageName);
                                    }
                                });

                                // Create image buttons for this face
                                uniqueImageNames.forEach(imageName => {
                                    const buttonContainer = document.createElement('div');
                                    buttonContainer.style.display = 'flex';
                                    buttonContainer.style.flexDirection = 'column';
                                    buttonContainer.style.alignItems = 'center';
                                    buttonContainer.style.gap = '5px';
                                    buttonContainer.style.position = 'relative';

                                    const imgButton = document.createElement('img');
                                    imgButton.className = 'image-upload-button';
                                    imgButton.style.width = '100px';
                                    imgButton.style.height = '100px';
                                    imgButton.style.objectFit = 'cover';
                                    imgButton.style.cursor = 'pointer';
                                    imgButton.style.border = '2px solid #007bff';
                                    imgButton.style.borderRadius = '5px';

                                    // Create file input first
                                    const fileInput = document.createElement('input');
                                    fileInput.type = 'file';
                                    fileInput.accept = 'image/*';
                                    fileInput.style.display = 'none';
                                    fileInput.dataset.faceId = faceId;
                                    fileInput.dataset.imageName = imageName;

                                    // Set default image or placeholder
                                    if (imageName === 'Default') {
                                        imgButton.src = 'GERGFACE.png';
                                    } else {
                                        imgButton.src = 'data:image/svg+xml,' + encodeURIComponent(`
                                            <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
                                                <rect width="100%" height="100%" fill="#f0f0f0"/>
                                                <text x="50%" y="50%" font-family="Arial" font-size="12" 
                                                    fill="#666" text-anchor="middle" dy=".3em">Click to Upload</text>
                                            </svg>
                                        `);
                                    }

                                    // Add delete button
                                    const deleteBtn = document.createElement('button');
                                    deleteBtn.innerHTML = '×';
                                    deleteBtn.style.position = 'absolute';
                                    deleteBtn.style.top = '5px';
                                    deleteBtn.style.right = '5px';
                                    deleteBtn.style.width = '24px';
                                    deleteBtn.style.height = '24px';
                                    deleteBtn.style.borderRadius = '6px';
                                    deleteBtn.style.border = 'none';
                                    deleteBtn.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
                                    deleteBtn.style.color = 'white';
                                    deleteBtn.style.cursor = 'pointer';
                                    deleteBtn.style.display = 'none';
                                    deleteBtn.style.alignItems = 'center';
                                    deleteBtn.style.justifyContent = 'center';
                                    deleteBtn.style.fontSize = '18px';
                                    deleteBtn.style.fontWeight = '500';
                                    deleteBtn.style.padding = '0';
                                    deleteBtn.style.zIndex = '1';
                                    deleteBtn.style.transition = 'all 0.2s ease';

                                    // Add delete functionality
                                    deleteBtn.addEventListener('click', (e) => {
                                        e.stopPropagation();
                                        imgButton.src = 'data:image/svg+xml,' + encodeURIComponent(`
                                            <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
                                                <rect width="100%" height="100%" fill="#f0f0f0"/>
                                                <text x="50%" y="50%" font-family="Arial" font-size="12" 
                                                    fill="#666" text-anchor="middle" dy=".3em">Click to Upload</text>
                                            </svg>
                                        `);
                                        deleteBtn.style.display = 'none';
                                        fileInput.value = '';
                                        imageButtons.set(`${faceId}_${imageName}`, imgButton);
                                        drawFrame();
                                    });

                                    // File input change handler
                                    fileInput.addEventListener('change', (e) => {
                                        const file = e.target.files[0];
                                        if (file) {
                                            const reader = new FileReader();
                                            reader.onload = (e) => {
                                                const img = new Image();
                                                img.onload = () => {
                                                    imgButton.src = e.target.result;
                                                    deleteBtn.style.display = 'flex';
                                                    imageButtons.set(`${faceId}_${imageName}`, imgButton);
                                                    drawFrame();
                                                    requestAnimationFrame(drawFrame);
                                                };
                                                img.src = e.target.result;
                                            };
                                            reader.readAsDataURL(file);
                                        }
                                    });

                                    imgButton.addEventListener('click', () => {
                                        fileInput.click();
                                    });

                                    const label = document.createElement('div');
                                    label.textContent = imageName;
                                    label.style.fontSize = '14px';
                                    label.style.color = '#666';

                                    buttonContainer.appendChild(imgButton);
                                    buttonContainer.appendChild(deleteBtn);
                                    buttonContainer.appendChild(label);
                                    buttonContainer.appendChild(fileInput);
                                    imageButtonsContainer.appendChild(buttonContainer);

                                    // Store the image button reference
                                    imageButtons.set(`${faceId}_${imageName}`, imgButton);
                                });

                                faceContainer.appendChild(imageButtonsContainer);
                                uploadContainer.appendChild(faceContainer);
                            });

                            // Update the frameData references
                            originalFrameData = data;
                            frameData = data.faces?.face1 || {};
                            
                            // Redraw frame with new data
                            drawFrame();
                        }
                        
                    } catch (error) {
                        console.error('Error loading JSON:', error);
                        jsonFileName.textContent = 'Error loading JSON file';
                        jsonFileName.style.color = '#dc3545';
                    }
                }
            });
        });
    </script>
</body>
</html>
