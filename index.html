<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
    <meta http-equiv="Cross-Origin-Resource-Policy" content="cross-origin">
    <title>GIFCITY</title>
    <link rel="icon" href="/public/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Work+Sans:ital,wght@1,600&display=swap">
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
    <div class="container">
        <div id="header-container"></div>

        <!-- Meme Equation Container -->
        <div class="meme-equation">
            <div class="meme-image">
                <div class="meme-text-overlay">FACES</div>
                <img src="/src/assets/images/faces.png" alt="Face 1">
            </div>
            <div class="meme-operator">+</div>
            <div class="meme-image">
                <div class="meme-text-overlay" id="memeVideo">VIDEO</div>
                <img src="/src/assets/images/gif_blank.gif" alt="Face 2">
            </div>
            <div class="meme-operator">=</div>
            <div class="meme-image">
                <div class="meme-text-overlay" id="memeResult">SILLY MEMES!</div>
                <img src="/src/assets/images/gif_faces.gif" alt="Result">
            </div>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search templates...">
            <button class="search-btn">🔍</button>
        </div>

        <div class="tab-container">
            <div class="tabs">
                <div class="tab active">All</div>
                <div class="tab">1 😁</div>
                <div class="tab">2 🤪</div>
                <div class="tab">3+ 😎</div>
            </div>
        </div>

        <div class="gallery-container">
            <div class="gallery" id="templateGallery">
                <!-- Templates will be loaded here -->
            </div>
        </div>

        <!-- Pricing Tiers Container -->
        <div class="pricing-container">
            <h2 class="pricing-title">PURCHASE CREDITS!</h2>
            
            <div class="pricing-tiers">
                <!-- 100 Credits -->
                <div class="pricing-card" id="tier1">
                    <div class="tier-image">
                        <img src="/src/assets/images/pack1.png" alt="100 Credits">
                    </div>
                    <div class="tier-info">
                        <h3>100</h3>
                        <p class="tier-name">CREDITS</p>
                    </div>
                    <div class="tier-price">
                        <p>USD $10</p>
                    </div>
                    <p class="price-per-credit">*$0.10 per credit</p>
                </div>

                <!-- 220 Credits -->
                <div class="pricing-card" id="tier2">
                    <div class="bonus-tag">10% EXTRA!</div>
                    <div class="tier-image">
                        <img src="/src/assets/images/pack2.png" alt="220 Credits">
                    </div>
                    <div class="tier-info">
                        <h3>220</h3>
                        <p class="tier-name">CREDITS</p>
                    </div>
                    <div class="tier-price">
                        <p>USD $20</p>
                    </div>
                    <p class="price-per-credit">*$0.09 per credit</p>
                </div>

                <!-- 430 Credits -->
                <div class="pricing-card" id="tier3">
                    <div class="bonus-tag">22% EXTRA!</div>
                    <div class="tier-image">
                        <img src="/src/assets/images/pack3.png" alt="430 Credits">
                    </div>
                    <div class="tier-info">
                        <h3>430</h3>
                        <p class="tier-name">CREDITS</p>
                    </div>
                    <div class="tier-price">
                        <p>USD $35</p>
                    </div>
                    <p class="price-per-credit">*$0.08 per credit</p>
                </div>

                <!-- 810 Credits -->
                <div class="pricing-card" id="tier4">
                    <div class="bonus-tag">35% EXTRA!</div>
                    <div class="tier-image">
                        <img src="/src/assets/images/pack4.png" alt="810 Credits">
                    </div>
                    <div class="tier-info">
                        <h3>810</h3>
                        <p class="tier-name">CREDITS</p>
                    </div>
                    <div class="tier-price">
                        <p>USD $60</p>
                    </div>
                    <p class="price-per-credit">*$0.07 per credit</p>
                </div>
            </div>
        </div>

        <div id="footer-container"></div>
    </div>

    <!-- Load core dependencies first -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script type="module" src="/src/supabase.js"></script>
    <script type="module" src="/src/auth.js"></script>
    <script type="module" src="/src/userService.js"></script>
    <script type="module" src="/src/app.js"></script>

    <!-- Then load your components -->
    <script src="/components.js"></script>
</body>
</html>
