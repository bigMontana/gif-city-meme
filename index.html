<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "VT323", serif;
            font-weight: 500;
            font-style: normal;
        }

        body {
            background-color: #121212;
            color: white;
        }
        
        .container {
            width: 60%;
            max-width: 1400px; /* Adjust this value to control overall size */
            margin: 0 auto;
            padding: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #121212;
            border-bottom: 1px solid #36B2B7;
        }

        .logo {
            font-size: 38px;  /* Increased font size for better VT323 display */
            font-weight: 500;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        
        .logo img {
            margin-right: 10px;
            width: 32px;
            height: 32px;
            border-radius: 2px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            font-family: "VT323", serif;
            font-weight: 500;
            font-size: 18px;  /* Increased font size for better VT323 display */
            cursor: pointer;
        }

        .btn-primary {
            background-color: #DA3A98;
            color: white;
        }

        .btn-secondary {
            background-color: #36B2B7;
            color: white;
        }

        .btn-light {
            background-color: white;
            color: black;
        }

        .search-container {
            margin: 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 15px;
            border-radius: 5px;
            border: none;
            font-size: 20px;
            background-color: #222;
            color: white;
            font-family: "VT323", serif;
        }

        .search-btn {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            padding: 0 20px;
            border: none;
            background-color: #DA3A98;
            color: white;
            border-top-right-radius: 5px;
            border-bottom-right-radius: 5px;
            cursor: pointer;
            font-family: "VT323", serif;
            font-size: 20px;
        }

        .tab-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            background-color: #222;
            border-radius: 30px;
            padding: 5px;
        }

        .tab {
            padding: 10px 30px;
            cursor: pointer;
            border-radius: 25px;
            color: white;
            font-size: 20px;  /* Increased font size for better VT323 display */
        }

        .tab.active {
            background-color: #DA3A98;
            color: white;
        }

        /* New masonry gallery with exactly 4 columns */
        .gallery-container {
            padding: 0 20px;
        }
        
        .gallery {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;
            width: 100%;
        }

        .gallery-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .gallery-item {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 0;
            background-color: #222;
        }

        .gallery-item img {
            width: 100%;
            display: block;
            height: auto;
        }

        .footer {
            display: flex;
            justify-content: flex-start;
            padding: 20px;
            gap: 20px;
            margin-top: 40px;
        }

        .footer a {
            color: white;
            text-decoration: none;
            font-size: 18px;  /* Increased font size for better VT323 display */
            font-weight: 500;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .gallery {
                flex-wrap: wrap;
            }
            
            .gallery-column {
                flex: 0 0 calc(50% - 5px);
            }
        }

        @media (max-width: 480px) {
            .gallery-column {
                flex: 0 0 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="#" class="logo">
                <img src="xlogo2.png" alt="GIFGRID Logo">
                GIF CITY
            </a>
            <div class="buttons" id="headerButtons">
                <button class="btn btn-primary" id="uploadBtn" style="display: none;">Upload</button>
                <button class="btn btn-secondary" id="createBtn" style="display: none;">Create</button>
                <button class="btn btn-light" id="authBtn">Log In</button>
            </div>
        </header>

        <!-- Auth Modal -->
        <div id="authModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="loginForm">
                    <h2>Login</h2>
                    <input type="email" id="loginEmail" placeholder="Email" required>
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button class="btn btn-primary" onclick="login()">Login</button>
                    <p>Don't have an account? <a href="#" onclick="toggleAuthForm()">Sign Up</a></p>
                </div>
                <div id="signupForm" style="display: none;">
                    <h2>Sign Up</h2>
                    <input type="text" id="signupUsername" placeholder="Username" required>
                    <input type="email" id="signupEmail" placeholder="Email" required>
                    <input type="password" id="signupPassword" placeholder="Password" required>
                    <button class="btn btn-primary" onclick="signup()">Sign Up</button>
                    <p>Already have an account? <a href="#" onclick="toggleAuthForm()">Login</a></p>
                </div>
            </div>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search templates...">
            <button class="search-btn">🔍</button>
        </div>

        <div class="tab-container">
            <div class="tabs">
                <div class="tab active">All</div>
                <div class="tab">1 😁</div>
                <div class="tab">2 🤪</div>
                <div class="tab">3+ 😎</div>
            </div>
        </div>

        <div class="gallery-container">
            <div class="gallery" id="templateGallery">
                <!-- Templates will be loaded here -->
            </div>
        </div>

        <div class="footer">
            <a href="#">About</a>
            <a href="#">Terms</a>
            <a href="#">Privacy</a>
        </div>
    </div>

    <!-- Update script loading to use modules -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script type="module" src="supabase.js"></script>
    <script type="module" src="app.js"></script>
    <script type="module">
        import { supabase } from './supabase.js';

        // DOM Elements
        const authModal = document.getElementById('authModal');
        const closeBtn = document.querySelector('.close');
        const authBtn = document.getElementById('authBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const createBtn = document.getElementById('createBtn');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');

        // Auth state management
        let currentUser = null;

        // Check if user is already logged in
        supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                currentUser = session.user;
                updateUIForLoggedInUser();
            } else {
                currentUser = null;
                updateUIForLoggedOutUser();
            }
        });

        // UI Updates
        function updateUIForLoggedInUser() {
            authBtn.textContent = 'Logout';
            uploadBtn.style.display = 'block';
            createBtn.style.display = 'block';
        }

        function updateUIForLoggedOutUser() {
            authBtn.textContent = 'Login';
            uploadBtn.style.display = 'none';
            createBtn.style.display = 'none';
        }

        // Auth Modal Controls
        authBtn.onclick = () => {
            if (currentUser) {
                supabase.auth.signOut();
            } else {
                authModal.style.display = 'block';
            }
        }

        closeBtn.onclick = () => {
            authModal.style.display = 'none';
        }

        window.onclick = (event) => {
            if (event.target == authModal) {
                authModal.style.display = 'none';
            }
        }

        function toggleAuthForm() {
            loginForm.style.display = loginForm.style.display === 'none' ? 'block' : 'none';
            signupForm.style.display = signupForm.style.display === 'none' ? 'block' : 'none';
        }

        window.toggleAuthForm = toggleAuthForm;
        window.login = async () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const { error } = await signIn(email, password);
            if (error) {
                alert(error.message);
            } else {
                authModal.style.display = 'none';
            }
        };

        window.signup = async () => {
            const username = document.getElementById('signupUsername').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const { error } = await signUp(email, password, username);
            if (error) {
                alert(error.message);
            } else {
                authModal.style.display = 'none';
                alert('Check your email for verification link');
            }
        };
    </script>
</body>
</html>
